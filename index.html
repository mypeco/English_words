<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eigo Puzzle - 英語スペルパズル</title>
    
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes spin-in {
            from { transform: rotate(-180deg) scale(0); opacity: 0; }
            to { transform: rotate(0) scale(1); opacity: 1; }
        }
        .animate-spin-in {
            animation: spin-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes shine {
            0%, 80% { transform: scale(1); filter: brightness(100%) drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
            85% { transform: scale(1.2) rotate(-5deg); filter: brightness(130%) drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
            90% { transform: scale(1.2) rotate(5deg); filter: brightness(130%) drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
            100% { transform: scale(1); filter: brightness(100%) drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
        }
        .animate-shine {
            animation: shine 4s infinite;
            display: inline-block;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        /* ルビの調整 */
        ruby {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            ruby-align: center;
        }
        rt {
            font-size: 0.6em;
            font-weight: normal;
            color: #64748b; /* slate-500 */
            margin-bottom: -0.2em;
        }
        /* ポップアップ用アニメーション */
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-in {
            animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* カード内BestShot SVGを最大サイズで表示 */
        button .bestshot-wrap svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        /* カルタ：不正解シェイク */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to   { transform: translateX(0); }
        }
        .animate-slide-in-right {
            animation: slide-in-right 0.25s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        /* カルタ：パーティクル */
        @keyframes particle-fall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .karuta-particle {
            position: fixed;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 9999;
            animation: particle-fall linear forwards;
        }
    </style>
</head>

        // 単語の各文字インデックスが何番目の音節か返す
        // 例: 'rabbit' → [0,0,0,1,1,1]
        function getSyllableMap(word) {
            const syls = SYLLABLES[word.toLowerCase()];
            if (!syls) return null;
            const map = [];
            let idx = 0;
            syls.forEach((syl, si) => {
                for (let i = 0; i < syl.length; i++) {
                    map[idx++] = si;
                }
            });
            return map;
        }

        // --- 3. 音声・効果音エンジン ---

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();

        function initAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(type) {
            if (!state.isSoundOn) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            switch (type) {
                case 'tap':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
                case 'remove':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'hint':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'correct':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(659.25, now + 0.1); 
                    osc.frequency.setValueAtTime(783.99, now + 0.2); 
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                    break;
                case 'error':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'complete': 
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(659.25, now + 0.15); 
                    osc.frequency.setValueAtTime(783.99, now + 0.30); 
                    osc.frequency.setValueAtTime(1046.50, now + 0.45); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                    break;
                case 'perfect': 
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(523.25, now + 0.12); 
                    osc.frequency.setValueAtTime(523.25, now + 0.24); 
                    osc.frequency.setValueAtTime(783.99, now + 0.36); 
                    osc.frequency.setValueAtTime(659.25, now + 0.60); 
                    osc.frequency.setValueAtTime(783.99, now + 0.72); 
                    osc.frequency.setValueAtTime(1046.50, now + 0.84); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 2.0);
                    osc.start(now);
                    osc.stop(now + 2.0);
                    break;
                case 'crown': 
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1046.50, now); 
                    osc.frequency.setValueAtTime(1318.51, now + 0.1); 
                    osc.frequency.setValueAtTime(1567.98, now + 0.2); 
                    osc.frequency.setValueAtTime(2093.00, now + 0.4); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 1.0);
                    osc.start(now);
                    osc.stop(now + 1.0);
                    break;
                case 'stamp':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

            const savedData = localStorage.getItem(DATA_KEY);
            if (savedData) {
                state.allUsersData = JSON.parse(savedData);
            }

        function saveUsers() {
            localStorage.setItem(USERS_KEY, JSON.stringify(state.users));
        }

        function saveData() {
            localStorage.setItem(DATA_KEY, JSON.stringify(state.allUsersData));
        }

        // キー形式: ep_bs_{userId}_{wordEn（スペースをアンダースコアに）}
        function getBestShotKey(userId, wordEn) {
            return `ep_bs_${userId}_${wordEn.replace(/\s+/g, '_')}`;
        }
        function getBestShot(userId, wordEn) {
            return localStorage.getItem(getBestShotKey(userId, wordEn));
        }
        function saveBestShot(userId, wordEn, svgData) {
            localStorage.setItem(getBestShotKey(userId, wordEn), svgData);
        }

            if (wordLength >= 11) return { box: "w-10 h-14 md:w-12 md:h-16", text: "text-3xl md:text-4xl leading-relaxed pb-2" };
            if (wordLength >= 8)  return { box: "w-12 h-16 md:w-16 md:h-20", text: "text-4xl md:text-5xl leading-relaxed pb-2" };
            if (wordLength >= 6)  return { box: "w-14 h-18 md:w-18 md:h-24", text: "text-5xl md:text-6xl leading-relaxed pb-2" };
            return { box: "w-16 h-20 md:w-20 md:h-24", text: "text-6xl md:text-7xl leading-relaxed pb-3" };
        }

                ? state.allUsersData[state.currentUserId] 
                : { progress: {}, history: [], challengeWords: [] };
            
            if (!userData.challengeWords) userData.challengeWords = [];

            if (state.screen === 'userSelect') {
                renderUserSelect();
            } else if (state.screen === 'userEdit') {
                renderUserEdit();

                renderHome(currentUser, userData.progress, userData.challengeWords);
            } else if (state.screen === 'stampBook') {
                renderStampBook(userData.progress, userData.history || []);
            } else if (state.screen === 'history') {
                renderHistory(userData.history);
            } else if (state.screen === 'game') {
                renderGame(currentUser);
            } else if (state.screen === 'result') {
                renderResult(currentUser, userData.progress);
            } else if (state.screen === 'stampSelect') {
                renderStampSelect();
            } else if (state.screen === 'wordList') {

        function renderTestResult() {
            const isChallenge = state.testCategory === 'challenge_test';

                        <div class="flex flex-wrap gap-2">
                            ${state.testResults.filter(r => r.correct === false).map(r =>
                                `<span class="px-3 py-1 bg-red-100 text-red-600 rounded-full font-bold text-sm">${r.word.en}</span>`
                            ).join('')}

                    </div>` : ''}

                    ${canGetStamp ? `
                    <button onclick="state.currentCategory = '${catId}'; updateScreen('stampSelect'); playTone('tap')"
                        class="w-full py-4 bg-yellow-400 text-white rounded-2xl font-black text-xl shadow-lg border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 mb-3 animate-pulse">
                        スタンプを えらぶ！
                    </button>
                    <button onclick="updateScreen('wordList'); playTone('tap')" class="w-full py-3 rounded-xl bg-slate-100 text-slate-500 font-bold text-base">

                            もういちど
                        </button>
                        <button onclick="${isChallenge ? `updateScreen('home')` : `updateScreen('wordList')`}; playTone('tap')" class="flex-1 py-4 rounded-xl bg-slate-200 text-slate-700 font-bold text-lg shadow-md hover:bg-slate-300">

        // ★ テストモードのチャレンジ起動
        function startChallengeTest() {
            playTone('tap');
            const user = state.allUsersData[state.currentUserId];
            if (!user || !user.challengeTestWords || user.challengeTestWords.length === 0) return;

            state.testCategory = 'challenge_test';
            state.testWords = [...user.challengeTestWords].sort(() => Math.random() - 0.5);
            state.testWordIndex = 0;
            state.testRevealed = false;
            state.testInput = '';
            state.testStrokes = [];
            state.testSnapshotUrl = null;
            state.testResults = [];
            updateScreen('test');
        }

        function startTest(catId) {
            playTone('tap');
            const cat = DATA[catId];
            state.testCategory = catId;
            state.testWords = [...cat.words].sort(() => Math.random() - 0.5);
            state.testWordIndex = 0;
            state.testRevealed = false;
            state.testInput = '';
            state.testStrokes = [];
            state.testSnapshotUrl = null;
            state.testResults = [];
            state.testResultInfo = null;
            updateScreen('test');
        }

        function setTestInputMode(mode) {
            playTone('tap');
            state.testInputMode = mode;
            state.testInput = '';
            state.testStrokes = [];
            render();
        }

        function testReveal() {
            // 手書きモードならキャンバスをスナップショット
            if (state.testInputMode === 'canvas') {
                const canvas = document.getElementById('testCanvas');
                state.testSnapshotUrl = canvas ? canvas.toDataURL() : null;
            }
            state.testRevealed = true;
            const word = state.testWords[state.testWordIndex];
            speak(word.en);
            render();
        }

        function testNext(isCorrect) {
            playTone(isCorrect ? 'correct' : 'tap');
            const word = state.testWords[state.testWordIndex];
            state.testResults.push({ word, correct: isCorrect });

            // ★ 手書きモードで「登録」→ SVGをBestShotに保存
            if (isCorrect && state.testInputMode === 'canvas' && state.currentUserId) {
                saveTestBestShot(word);
            }

            if (state.currentUserId) {
                const user = state.allUsersData[state.currentUserId];
                if (user) {
                    if (!user.challengeTestWords) user.challengeTestWords = [];

                    if (state.testCategory === 'challenge_test') {
                        if (isCorrect) {
                            user.challengeTestWords = user.challengeTestWords.filter(w => w.en !== word.en);
                        }
                    } else {
                        if (!isCorrect) {
                            const exists = user.challengeTestWords.some(w => w.en === word.en);
                            if (!exists) user.challengeTestWords.push(word);
                        }
                    }
                    saveData();
                }
            }

            state.testWordIndex++;
            state.testRevealed = false;
            state.testInput = '';
            state.testStrokes = [];
            state.testSnapshotUrl = null;

            if (state.testWordIndex >= state.testWords.length) {
                // ── テスト完了：スタンプ進捗を計算 ──
                const total   = state.testResults.length;
                const correct = state.testResults.filter(r => r.correct === true).length;
                const pct     = Math.round((correct / total) * 100);
                const catId   = state.testCategory;

                let canGetStamp = false;
                let addedCount  = 0;

                if (state.currentUserId && catId !== 'challenge_test') {
                    const user = state.allUsersData[state.currentUserId];
                    if (!user.progress[catId]) {
                        user.progress[catId] = { perfectCount: 0, stamp: null, extraBadgeCount: 0 };
                    }
                    const p = user.progress[catId];

                    if (!p.stamp && pct >= 90) {
                        if (pct === 100) {
                            addedCount = Math.max(0, 3 - p.perfectCount);
                            p.perfectCount = 3;
                        } else {
                            const before = p.perfectCount;
                            p.perfectCount = Math.min(3, p.perfectCount + 2);
                            addedCount = p.perfectCount - before;
                        }
                        if (p.perfectCount >= 3) canGetStamp = true;
                        saveData();
                    } else if (p.stamp && pct === 100) {
                        const MAX_EXTRA = 4;
                        if ((p.extraBadgeCount || 0) < MAX_EXTRA) {
                            p.extraBadgeCount = (p.extraBadgeCount || 0) + 1;
                            addedCount = 1;
                            setTimeout(() => playTone('crown'), 500);
                        }
                        saveData();
                    }
                }

                state.testResultInfo = { pct, canGetStamp, addedCount, catId };
                if (canGetStamp) setTimeout(() => playTone('crown'), 1500);
                updateScreen('testResult');
            } else {
                render();
            }
        }

        function initTestCanvas() {
            const canvas = document.getElementById('testCanvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            redrawTestCanvas();

            const getPos = (e, canvas) => {
                const r = canvas.getBoundingClientRect();
                const src = e.touches ? e.touches[0] : e;
                return { x: src.clientX - r.left, y: src.clientY - r.top };
            };
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                state.testStrokes.push([getPos(e, canvas)]);
                state.testIsDrawing = true;
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                if (!state.testIsDrawing) return;
                state.testStrokes[state.testStrokes.length - 1].push(getPos(e, canvas));
                redrawTestCanvas();
            }, { passive: false });
            canvas.addEventListener('touchend', () => { state.testIsDrawing = false; });
            canvas.addEventListener('mousedown', e => {
                state.testStrokes.push([getPos(e, canvas)]);
                state.testIsDrawing = true;
            });
            canvas.addEventListener('mousemove', e => {
                if (!state.testIsDrawing) return;
                state.testStrokes[state.testStrokes.length - 1].push(getPos(e, canvas));
                redrawTestCanvas();
            });
            canvas.addEventListener('mouseup', () => { state.testIsDrawing = false; });
            canvas.addEventListener('mouseleave', () => { state.testIsDrawing = false; });
        }

        function redrawTestCanvas() {
            const canvas = document.getElementById('testCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            state.testStrokes.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
                ctx.stroke();
            });
        }

        function clearTestCanvas() {
            state.testStrokes = [];
            redrawTestCanvas();
        }

        function startKaruta(catId) {
            playTone('tap');
            const cat = DATA[catId];
            const shuffled = [...cat.words].sort(() => Math.random() - 0.5);
            state.karutaCategory = catId;
            state.karutaWords = shuffled;
            state.karutaCleared = [];
            state.karutaDone = false;
            state.karutaHint = false;
            state.karutaCurrentIdx = Math.floor(Math.random() * shuffled.length);
            updateScreen('karuta');
        }

        function karutaReadCurrent() {
            playTone('tap');
            if (state.karutaCurrentIdx >= 0 && !state.karutaDone) {
                speak(state.karutaWords[state.karutaCurrentIdx].en);
            }
        }

        function toggleKarutaHint() {
            playTone('hint');
            state.karutaHint = !state.karutaHint;
            render();
        }

        function launchKarutaParticles() {
            const colors = ['#f59e0b','#10b981','#6366f1','#ec4899','#f97316','#3b82f6','#a78bfa','#34d399'];
            const count = 80;
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'karuta-particle';
                    el.style.left = (Math.random() * 100) + 'vw';
                    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (8 + Math.random() * 10) + 'px';
                    el.style.height = (8 + Math.random() * 10) + 'px';
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    const duration = 1.5 + Math.random() * 2;
                    el.style.animationDuration = duration + 's';
                    el.style.animationDelay = '0s';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), duration * 1000 + 100);
                }, i * 30);
            }
        }

        function karutaTap(idx) {
            if (state.karutaDone) return;
            if (state.karutaCleared.includes(idx)) return;

            if (idx === state.karutaCurrentIdx) {
                // 正解！
                playTone('correct');
                state.karutaCleared.push(idx);

                const remaining = state.karutaWords.length - state.karutaCleared.length;
                if (remaining === 0) {
                    // 全クリア：画面遷移せずパーティクル演出
                    state.karutaDone = true;
                    render();
                    setTimeout(() => {
                        playTone('perfect');
                        launchKarutaParticles();
                    }, 200);
                } else {
                    // 未クリアの中からランダムに次を選ぶ
                    const unclearedIndices = state.karutaWords
                        .map((_, i) => i)
                        .filter(i => !state.karutaCleared.includes(i));
                    state.karutaCurrentIdx = unclearedIndices[Math.floor(Math.random() * unclearedIndices.length)];
                    render();
                    // 少し間を置いて読み上げ
                    setTimeout(() => speak(state.karutaWords[state.karutaCurrentIdx].en), 600);
                }
            } else {
                // 不正解
                playTone('error');
                // カード揺らすアニメ
                const btn = app.querySelectorAll('button[onclick^="karutaTap"]')[idx];
                if (btn) {
                    btn.classList.add('animate-shake');
                    setTimeout(() => btn.classList.remove('animate-shake'), 400);
                }
            }
        }

                const dayNames = ['日','月','火','水','木','金','土'];

                // その月のカレンダー情報
                const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0=日
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                // 履歴を日付ごとに整理 → { "2025/5/15": [emoji1, emoji2, ...] }
                const dateMap = {};
                (history || []).forEach(record => {
                    const dateStr = record.date.split(' ')[0]; // "2025/5/15"
                    const parts = dateStr.split('/');
                    const recYear = parseInt(parts[0]);
                    const recMonth = parseInt(parts[1]) - 1; // 0-based
                    const recDay = parseInt(parts[2]);

                    if (recYear === year && recMonth === month && record.categoryId !== 'challenge_mode') {
                        const key = recDay;
                        if (!dateMap[key]) dateMap[key] = [];
                        const emoji = DATA[record.categoryId]?.words[0]?.emoji;
                        if (emoji && !dateMap[key].includes(emoji)) {
                            dateMap[key].push(emoji);
                        }
                    } else if (recYear === year && recMonth === month && record.categoryId === 'challenge_mode') {
                        const key = recDay;
                        if (!dateMap[key]) dateMap[key] = [];
                        if (!dateMap[key].includes('🔥')) dateMap[key].push('🔥');
                    }
                });

                const today = new Date();
                const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
                const todayDay = isCurrentMonth ? today.getDate() : -1;

                html += `
                    <div class="bg-white rounded-3xl shadow-xl border-4 border-amber-200 overflow-hidden">

                            </button>
                            <span class="text-xl font-black text-white drop-shadow-sm">${year}年 ${monthNames[month]}</span>

                                <i data-lucide="chevron-right" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <!-- 曜日ヘッダー -->
                        <div class="grid grid-cols-7 bg-amber-50 border-b border-amber-100">

                                <div class="py-2 text-center text-xs font-black ${i===0 ? 'text-red-500' : i===6 ? 'text-blue-500' : 'text-slate-500'}">${d}</div>
                            `).join('')}

                        <!-- カレンダーグリッド -->
                        <div class="grid grid-cols-7 p-2 gap-1">`;

                for (let i = 0; i < firstDayOfWeek; i++) {
                    html += `<div class="aspect-square"></div>`;
                }

                // 日付マス
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayOfWeek = (firstDayOfWeek + day - 1) % 7;
                    const isToday = (day === todayDay);
                    const dayEmojis = dateMap[day] || [];
                    const hasRecord = dayEmojis.length > 0;

                    const textColor = dayOfWeek === 0 ? 'text-red-500' : dayOfWeek === 6 ? 'text-blue-500' : 'text-slate-700';
                    const bgStyle = isToday 
                        ? 'bg-amber-100 border-2 border-amber-400 shadow-sm'

                    html += `
                        <div class="rounded-lg p-0.5 flex flex-col items-center min-h-[3rem] ${bgStyle}">
                            <div class="text-[10px] font-bold ${textColor} ${isToday ? 'bg-amber-400 text-white w-4 h-4 rounded-full flex items-center justify-center text-[9px]' : ''}">${day}</div>

                                <div class="flex flex-wrap justify-center gap-0 mt-0.5">
                                    ${dayEmojis.slice(0, 3).map(e => `<span class="text-sm leading-tight animate-spin-in">${e}</span>`).join('')}
                                    ${dayEmojis.length > 3 ? `<span class="text-[8px] font-bold text-slate-400">+${dayEmojis.length-3}</span>` : ''}
                                </div>
                            ` : ''}
                        </div>`;
                }

                html += `</div>`;

                // この月の取り組み回数
                const monthTotal = (history || []).filter(r => {
                    const parts = r.date.split(' ')[0].split('/');
                    return parseInt(parts[0]) === year && parseInt(parts[1]) - 1 === month;
                }).length;

                html += `
                        <!-- 月間まとめ -->
                        <div class="px-4 py-3 bg-amber-50 border-t border-amber-100 flex items-center justify-between">
                            <span class="text-sm font-bold text-amber-700">この月のがんばり</span>
                            <span class="text-xl font-black text-amber-600">${monthTotal}<span class="text-sm font-bold text-amber-400"> かい</span></span>
                        </div>
                    </div>`;
            }

            html += `</div></div>`;
            app.innerHTML = html;
        }

        // ★ 練習フェーズのロード（フェーズに応じてヒントON/OFF）
        function loadPracticeQuestion(autoSpeak = true) {
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const targetWord = word.en;

            const letters = targetWord.split('').map((char, i) => ({
                char, id: `${char}-${i}-${Math.random()}`
            }));
            state.practicePoolLetters = letters.filter(l => l.char !== ' ').sort(() => Math.random() - 0.5);
            state.practiceAnswerSlots = letters.map(l => l.char === ' ' ? l : null);
            state.practiceIsCorrect = false;

            if (autoSpeak) setTimeout(() => speak(targetWord), 300);
        }

        // ★ 練習フェーズ進行
        function nextPracticePhase() {
            state.practicePhase++;
            const hc = state.settings.hintCount;
            const nc = state.settings.noHintCount;
            const totalPhases = hc + nc;

            if (state.practicePhase < totalPhases) {
                loadPracticeQuestion(false);
                updateScreen('wordPractice');
                const cat = DATA[state.wordListCategory];
                const word = cat.words[state.practiceWordIndex];
                setTimeout(() => speak(word.en), 800);

        // ★ 練習モードのプールクリック
        function handlePracticePoolClick(letterId) {

            const letter = state.practicePoolLetters.find(l => l.id === letterId);
            if (!letter) return;
            if (state.practiceAnswerSlots.some(l => l?.id === letter.id)) return;

            const firstEmptyIndex = state.practiceAnswerSlots.findIndex(slot => slot === null);
            if (firstEmptyIndex === -1) return;

            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const targetChar = word.en[firstEmptyIndex];

            if (letter.char !== targetChar) {
                playTone('error');
            } else {
                playTone('tap');
            }

            state.practiceAnswerSlots[firstEmptyIndex] = letter;
            renderWordPractice();
            checkPracticeAnswer();

            const currentAnswer = state.practiceAnswerSlots.map(l => l ? l.char : '').join('');

        // ★ なぞりキャンバスの初期化
        function initTracingCanvas() {
            const canvas = document.getElementById('tracingCanvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#3730a3';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            redrawTracing();

            // タッチイベント
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const pt = getTouchPoint(e.touches[0], canvas);
                state.tracingStrokes.push([pt]);
                state.isTracingDrawing = true;
            }, { passive: false });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!state.isTracingDrawing) return;
                const pt = getTouchPoint(e.touches[0], canvas);
                state.tracingStrokes[state.tracingStrokes.length - 1].push(pt);
                redrawTracing();
            }, { passive: false });
            canvas.addEventListener('touchend', () => { state.isTracingDrawing = false; });

            // マウスイベント
            canvas.addEventListener('mousedown', (e) => {
                const pt = getMousePoint(e, canvas);
                state.tracingStrokes.push([pt]);
                state.isTracingDrawing = true;
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!state.isTracingDrawing) return;
                const pt = getMousePoint(e, canvas);
                state.tracingStrokes[state.tracingStrokes.length - 1].push(pt);
                redrawTracing();
            });
            canvas.addEventListener('mouseup', () => { state.isTracingDrawing = false; });
            canvas.addEventListener('mouseleave', () => { state.isTracingDrawing = false; });
        }

        function getTouchPoint(touch, canvas) {
            const rect = canvas.getBoundingClientRect();
            return { x: touch.clientX - rect.left, y: touch.clientY - rect.top };
        }
        function getMousePoint(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        function redrawTracing() {
            const canvas = document.getElementById('tracingCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#3730a3';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            state.tracingStrokes.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) {
                    ctx.lineTo(stroke[i].x, stroke[i].y);
                }
                ctx.stroke();
            });
        }

        function clearTracing() {
            state.tracingStrokes = [];
            redrawTracing();
        }

        function saveTracing() {
            const canvas = document.getElementById('tracingCanvas');
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const lw = 6;

            // ストロークをSVGパスに変換
            const w = canvas ? canvas.width : 300;
            const h = canvas ? canvas.height : 300;

            const paths = state.tracingStrokes.map(stroke => {
                if (stroke.length < 2) return '';
                let d = `M ${stroke[0].x.toFixed(1)} ${stroke[0].y.toFixed(1)}`;
                for (let i = 1; i < stroke.length; i++) {
                    d += ` L ${stroke[i].x.toFixed(1)} ${stroke[i].y.toFixed(1)}`;
                }
                return `<path d="${d}" stroke="#3730a3" stroke-width="${lw.toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
            }).filter(Boolean).join('');

            const svgData = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="width:100%;height:100%">${paths}</svg>`;

            if (state.currentUserId && paths) {
                saveBestShot(state.currentUserId, word.en, svgData);
                playTone('complete');
            }

            // 単語カード一覧に戻る
            updateScreen('wordList');
        }

        function startChallengeMode() {
            playTone('tap');
            state.currentCategory = 'challenge_mode';
            state.questionIndex = 0;
            state.sessionPerfectWordCount = 0;
            state.sessionErrorWords = [];
            state.showHint = false; // ★チャレンジ開始時にリセット

        function loadQuestion(catId, index) {
            let cat;
            if (catId === 'challenge_mode') {
                const words = state.allUsersData[state.currentUserId].challengeWords || [];
                cat = { words: words };
            } else {
                cat = DATA[catId];
            }

            const targetWord = cat.words[index].en;
            
            const letters = targetWord.split('').map((char, i) => ({ char, id: `${char}-${i}-${Math.random()}` }));
            state.poolLetters = letters.filter(l => l.char !== ' ').sort(() => Math.random() - 0.5);
            state.answerSlots = letters.map(l => l.char === ' ' ? l : null);
            
            state.isCorrect = false;
            state.currentWordHadError = false;

            // state.showHint = false; // ★削除：ここを消してヒント状態を維持
            state.currentWordUsedHint = state.showHint; // ★追加：ヒントがONなら「使用済み」とする
            
            setTimeout(() => speak(targetWord), 500);
        }

        function handlePoolClick(letterId) {
            if (state.isCorrect) return;
            const letter = state.poolLetters.find(l => l.id === letterId);
            if (!letter) return;
            
            if (state.answerSlots.some(l => l?.id === letter.id)) return;

            const firstEmptyIndex = state.answerSlots.findIndex(slot => slot === null);
            if (firstEmptyIndex !== -1) {
                let cat;
                if (state.currentCategory === 'challenge_mode') {
                    cat = { words: state.allUsersData[state.currentUserId].challengeWords };
                } else {
                    cat = DATA[state.currentCategory];
                }
                const targetChar = cat.words[state.questionIndex].en[firstEmptyIndex];
                
                if (letter.char !== targetChar) {
                    state.currentWordHadError = true; 
                    playTone('error'); 
                } else {
                    playTone('tap');
                }

                state.answerSlots[firstEmptyIndex] = letter;
                render();
                checkAnswer();
            }
        }

        function handleAnswerClick(index) {
            if (state.isCorrect) return;
            const slot = state.answerSlots[index];
            if (slot && slot.char === ' ') return;
            
            playTone('remove');
            state.answerSlots[index] = null;
            render();
        }

        function toggleHint() {
            if (!state.showHint) {
                playTone('hint');
                state.showHint = true;
                state.currentWordUsedHint = true; 
                render();
            } else {
                state.showHint = false;
                render();
            }
        }

        function handleSpeak() {
            let cat;
            if (state.currentCategory === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords };
            } else {
                cat = DATA[state.currentCategory];
            }
            const word = cat.words[state.questionIndex].en;
            speak(word);
        }

        function checkAnswer() {
            let cat;
            if (state.currentCategory === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords };
            } else {
                cat = DATA[state.currentCategory];
            }
            const targetWord = cat.words[state.questionIndex].en;
            const currentAnswer = state.answerSlots.map(l => l ? l.char : '').join('');

            if (state.answerSlots.every(s => s !== null) && currentAnswer === targetWord) {
                playTone('correct');
                state.isCorrect = true;
                
                if (!state.currentWordUsedHint && !state.currentWordHadError) {
                    state.sessionPerfectWordCount++;
                    if (state.currentCategory === 'challenge_mode') {
                        // nextQuestionで処理
                    }

                } else if (state.currentWordHadError) {
                    // ミスあり（ヒント使用の有無に関わらず）→ チャレンジBOX
                    if (state.currentCategory !== 'challenge_mode') {
                        const alreadyIn = state.sessionErrorWords.some(w => w.en === cat.words[state.questionIndex].en);
                        if (!alreadyIn) {
                            state.sessionErrorWords.push(cat.words[state.questionIndex]);
                        }
                    }
                }

                render();
                setTimeout(() => speak("Great! " + targetWord), 300);
            }
        }

        function nextQuestion() {
            playTone('tap');
            let cat;
            if (state.currentCategory === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords };
            } else {
                cat = DATA[state.currentCategory];
            }

            if (state.currentCategory === 'challenge_mode' && state.isCorrect) {
                if (!state.currentWordUsedHint && !state.currentWordHadError) {
                    const solvedWordEn = cat.words[state.questionIndex].en;
                    const user = state.allUsersData[state.currentUserId];
                    user.challengeWords = user.challengeWords.filter(w => w.en !== solvedWordEn);
                    state.questionIndex--; 
                    saveData();
                }
            }

            let currentWordsLength = 0;
            if (state.currentCategory === 'challenge_mode') {
                currentWordsLength = state.allUsersData[state.currentUserId].challengeWords.length;
            } else {
                currentWordsLength = DATA[state.currentCategory].words.length;
            }

            if (state.questionIndex + 1 < currentWordsLength) {
                state.questionIndex++;
                loadQuestion(state.currentCategory, state.questionIndex);
                render();
            } else {
                // Complete Logic
                let accuracy = 0;
                if (currentWordsLength > 0) {
                     accuracy = Math.round((state.sessionPerfectWordCount / currentWordsLength) * 100);
                } else {
                    accuracy = 100;
                }

                // ★変更：合格ラインと100点満点の判定を分ける
                const isPass = accuracy >= 90;
                const isPerfect = accuracy === 100; 
                
                if (isPerfect) {
                    playTone('perfect');
                } else if (isPass) {
                    playTone('complete');
                } else {
                    playTone('complete');
                }

                const now = new Date();
                const today = now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'});
                const user = state.allUsersData[state.currentUserId];
                user.history.unshift({ date: today, categoryId: state.currentCategory, isPass });
                if (user.history.length > HISTORY_LIMIT) user.history = user.history.slice(0, HISTORY_LIMIT);

                if (state.currentCategory !== 'challenge_mode') {
                    state.sessionErrorWords.forEach(word => {
                        const exists = user.challengeWords.some(w => w.en === word.en);
                        if (!exists) {
                            user.challengeWords.push(word);
                        }
                    });
                }
                
                let canGetStamp = false;
                let gotExtraBadge = false; // ★追加：バッジが増えたかのフラグ
                const catId = state.currentCategory;

                // ★変更：バッジ追加のロジック
                if (catId !== 'challenge_mode') {
                    if (!user.progress[catId]) {
                        user.progress[catId] = { perfectCount: 0, stamp: null, extraBadgeCount: 0 };
                    }
                    if (user.progress[catId].extraBadgeCount === undefined) {
                        user.progress[catId].extraBadgeCount = 0;
                    }

                    if (!user.progress[catId].stamp) {
                        if (isPass) {
                            user.progress[catId].perfectCount += 1;
                            if (user.progress[catId].perfectCount >= 3) {
                                canGetStamp = true;
                                setTimeout(() => playTone('crown'), 1500); 
                            }
                        }
                    } else {
                        // 既にスタンプがあり、100点満点の場合（合計5個＝追加分の上限を4とする）
                        const MAX_EXTRA_BADGES = 4;
                        if (isPerfect && user.progress[catId].extraBadgeCount < MAX_EXTRA_BADGES) {
                            user.progress[catId].extraBadgeCount += 1;
                            gotExtraBadge = true;
                            setTimeout(() => playTone('crown'), 500); 
                        }
                    }
                }
                saveData();
                // ★変更：gotExtraBadge をリザルトに渡す
                state.resultInfo = { isPass, score: accuracy, canGetStamp, gotExtraBadge };
                updateScreen('result');
            }
        }

        function getStamp(stamp) {
            const user = state.allUsersData[state.currentUserId];
            if (user.progress[state.currentCategory]) {
                user.progress[state.currentCategory].stamp = stamp;
            }
            saveData();
            playTone('stamp');
            state.stampBookPage = 1; // スタンプゲット後は1ページ目を表示
            updateScreen('stampBook');
        }

        function setStampBookPage(page) {
            playTone('tap');
            state.stampBookPage = page;
            render();
        }

        function navigateCalendar(delta) {
            playTone('tap');
            state.calendarMonth += delta;
            if (state.calendarMonth > 11) {
                state.calendarMonth = 0;
                state.calendarYear++;
            }
            if (state.calendarMonth < 0) {
                state.calendarMonth = 11;
                state.calendarYear--;
            }
            render();
        }

        function goToCalendar() {
            playTone('tap');
            state.stampBookPage = 2;
            // 今月に戻す
            state.calendarYear = new Date().getFullYear();
            state.calendarMonth = new Date().getMonth();
            updateScreen('stampBook');
        }

        function clearHistory() {
            if (!confirm('ほんとうに きろくを ぜんぶ けしますか？')) return;
            state.allUsersData[state.currentUserId].history = [];
            saveData();
            playTone('remove');
            render();
        }

        // --- 7. キーボード入力対応 (Updated for strict case matching) ---
        window.addEventListener('keydown', (e) => {
            // ── game 画面 ──
            if (state.screen === 'game') {
                if (state.isCorrect) {
                    if (e.key === 'Enter') nextQuestion();
                    return;
                }
                if (e.key === 'Backspace') {
                    for (let i = state.answerSlots.length - 1; i >= 0; i--) {
                        const slot = state.answerSlots[i];
                        if (slot && slot.char !== ' ') { handleAnswerClick(i); return; }
                    }
                    return;
                }
                if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                    const targetLetter = state.poolLetters.find(l => {
                        const isUsed = state.answerSlots.some(slot => slot?.id === l.id);
                        return !isUsed && l.char === e.key;
                    });
                    if (targetLetter) handlePoolClick(targetLetter.id);
                }
                return;
            }

            // ── wordPractice 画面（シームレスタップ＆タイピング）──
            if (state.screen === 'wordPractice') {
                if (state.practiceIsCorrect) return;

                // Backspace：最後に入れた文字を戻す
                if (e.key === 'Backspace') {
                    for (let i = state.practiceAnswerSlots.length - 1; i >= 0; i--) {
                        const slot = state.practiceAnswerSlots[i];
                        if (slot && slot.char !== ' ') { handlePracticeAnswerClick(i); return; }
                    }
                    return;
                }

                // アルファベット：プールから探してタップと同じ処理
                if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                    const targetLetter = state.practicePoolLetters.find(l => {
                        const isUsed = state.practiceAnswerSlots.some(slot => slot?.id === l.id);
                        return !isUsed && l.char === e.key;
                    });
                    if (targetLetter) handlePracticePoolClick(targetLetter.id);
                }
                return;
            }
        });

        // 初期化
        initData();
        render();

    </script>
</body>
</html>
