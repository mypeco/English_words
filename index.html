<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eigo Puzzle - 英語スペルパズル</title>
    
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes spin-in {
            from { transform: rotate(-180deg) scale(0); opacity: 0; }
            to { transform: rotate(0) scale(1); opacity: 1; }
        }
        .animate-spin-in {
            animation: spin-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes shine {
            0%, 80% { transform: scale(1); filter: brightness(100%) drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
            85% { transform: scale(1.2) rotate(-5deg); filter: brightness(130%) drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
            90% { transform: scale(1.2) rotate(5deg); filter: brightness(130%) drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
            100% { transform: scale(1); filter: brightness(100%) drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
        }
        .animate-shine {
            animation: shine 4s infinite;
            display: inline-block;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        ruby {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            ruby-align: center;
        }
        rt {
            font-size: 0.6em;
            font-weight: normal;
            color: #64748b;
            margin-bottom: -0.2em;
        }
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-in {
            animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        button .bestshot-wrap svg {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes slide-in-right {
            from { transform: translateX(100%); }
            to   { transform: translateX(0); }
        }
        .animate-slide-in-right {
            animation: slide-in-right 0.25s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        @keyframes particle-fall {
            0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        .karuta-particle {
            position: fixed;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            pointer-events: none;
            z-index: 9999;
            animation: particle-fall linear forwards;
        }
    </style>
</head>

        function getSyllableMap(word) {
            const syls = SYLLABLES[word.toLowerCase()];
            if (!syls) return null;
            const map = [];
            let idx = 0;
            syls.forEach((syl, si) => {
                for (let i = 0; i < syl.length; i++) {
                    map[idx++] = si;
                }
            });
            return map;
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();

        function initAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(type) {
            if (!state.isSoundOn) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            switch (type) {
                case 'tap':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now); osc.stop(now + 0.08); break;
                case 'remove':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1); break;
                case 'hint':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(1200, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3); break;
                case 'correct':
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.6);
                    osc.start(now); osc.stop(now + 0.6); break;
                case 'error':
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now); osc.stop(now + 0.2); break;
                case 'complete':
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.15); osc.frequency.setValueAtTime(783.99, now + 0.30); osc.frequency.setValueAtTime(1046.50, now + 0.45);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start(now); osc.stop(now + 0.8); break;
                case 'perfect':
                    osc.type = 'square'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(523.25, now + 0.12); osc.frequency.setValueAtTime(523.25, now + 0.24); osc.frequency.setValueAtTime(783.99, now + 0.36); osc.frequency.setValueAtTime(659.25, now + 0.60); osc.frequency.setValueAtTime(783.99, now + 0.72); osc.frequency.setValueAtTime(1046.50, now + 0.84);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 2.0);
                    osc.start(now); osc.stop(now + 2.0); break;
                case 'crown':
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(1046.50, now); osc.frequency.setValueAtTime(1318.51, now + 0.1); osc.frequency.setValueAtTime(1567.98, now + 0.2); osc.frequency.setValueAtTime(2093.00, now + 0.4);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 1.0);
                    osc.start(now); osc.stop(now + 1.0); break;
                case 'stamp':
                    osc.type = 'sine'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15); break;
            }
        }

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);

            if (wordLength >= 11) return { box: "w-10 h-14 md:w-12 md:h-16", text: "text-3xl md:text-4xl leading-relaxed pb-2" };
            if (wordLength >= 8)  return { box: "w-12 h-16 md:w-16 md:h-20", text: "text-4xl md:text-5xl leading-relaxed pb-2" };
            if (wordLength >= 6)  return { box: "w-14 h-18 md:w-18 md:h-24", text: "text-5xl md:text-6xl leading-relaxed pb-2" };
            return { box: "w-16 h-20 md:w-20 md:h-24", text: "text-6xl md:text-7xl leading-relaxed pb-3" };

            state.screen = screenName;

        // 「なぜ必要か」：renderSettingsPage内のボタンがこれを呼ぶが、
        //               元のコードでは定義されておらず、設定が変わらないバグがあった
        function setPracticeCount(key, val) {

        const app = document.getElementById('app');

            app.innerHTML = '';
            const currentUser = state.users.find(u => u.id === state.currentUserId);
            const userData = (state.currentUserId && state.allUsersData[state.currentUserId]) 
                ? state.allUsersData[state.currentUserId] 
                : { progress: {}, history: [], challengeWords: [] };
            if (!userData.challengeWords) userData.challengeWords = [];

            if (state.screen === 'userSelect') renderUserSelect();
            else if (state.screen === 'userEdit') renderUserEdit();
            else if (state.screen === 'home') renderHome(currentUser, userData.progress, userData.challengeWords);
            else if (state.screen === 'stampBook') renderStampBook(userData.progress, userData.history || []);
            else if (state.screen === 'history') renderHistory(userData.history);
            else if (state.screen === 'game') renderGame(currentUser);
            else if (state.screen === 'result') renderResult(currentUser, userData.progress);
            else if (state.screen === 'stampSelect') renderStampSelect();
            else if (state.screen === 'wordList') renderWordList(currentUser);
            else if (state.screen === 'wordPractice') renderWordPractice(currentUser);
            else if (state.screen === 'tracing') renderTracing(currentUser);
            else if (state.screen === 'karuta') renderKaruta(currentUser);
            else if (state.screen === 'settings') renderSettingsPage();
            else if (state.screen === 'test') renderTest();

                    <div class="grid grid-cols-4 gap-4 flex-1 pb-4">`;
            cat.words.forEach((word, idx) => {
                const bs = state.currentUserId ? getBestShot(state.currentUserId, word.en) : null;
                html += `
                <button onclick="startWordPractice('${cat.id}', ${idx}); playTone('tap')"
                    class="bg-white rounded-2xl shadow-sm border-2 border-slate-100 flex flex-col items-center justify-center p-3 gap-2 aspect-square transition-all hover:shadow-md hover:border-indigo-200 active:scale-95 relative overflow-hidden">
                    <div class="flex-1 flex items-center justify-center w-full min-h-0 relative">
                        ${bs
                            ? `<div class="bestshot-wrap w-full h-full flex items-center justify-center p-1">${bs}</div>
                               <div class="absolute bottom-1 left-0 right-0 flex justify-center text-2xl leading-none select-none opacity-80">${word.emoji}</div>`
                            : `<div class="text-5xl leading-none select-none">${word.emoji}</div>`
                        }
                    </div>
                    <div class="text-base font-bold text-slate-600 truncate w-full text-center">${word.en}</div>
                    <div class="text-xs text-slate-400 font-bold truncate w-full text-center">${stripHtml(word.jp)}</div>
                </button>`;
            });
            html += `</div></div></div>`;
            app.innerHTML = html;
            lucide.createIcons();
        }

        // ★ 単語練習画面
        // 「ながれ」：🌟×hintCount回 → 💪×noHintCount回 → ✏️なぞり → 一覧へ
        function renderWordPractice(currentUser) {
            const cat = DATA[state.wordListCategory];
            if (!cat) { updateScreen('home'); return; }
            const word = cat.words[state.practiceWordIndex];
            const phase = state.practicePhase;
            const sizeClass = getSlotSizeClass(word.en.length);
            const hc = state.settings.hintCount;
            const nc = state.settings.noHintCount;

            // ステッパー表示（🌟×hc + 💪×nc + ✏️）
            let stepperHtml = `<div class="flex gap-1 items-center justify-center mb-4 flex-wrap">`;
            const allSteps = [
                ...Array(hc).fill('🌟'),
                ...Array(nc).fill('💪'),
                '✏️'
            ];
            const stepColors = [
                ...Array(hc).fill('bg-yellow-400'),
                ...Array(nc).fill('bg-green-400'),
                'bg-indigo-400'
            ];
            allSteps.forEach((label, i) => {
                const isActive = i === phase;
                const isDone = i < phase;
                stepperHtml += `
                <div class="flex items-center gap-1">
                    <div class="w-8 h-8 rounded-full font-bold text-xs flex items-center justify-center transition-all
                        ${isActive ? stepColors[i] + ' text-white shadow-md scale-110' : isDone ? 'bg-slate-200 text-slate-400' : 'bg-slate-100 text-slate-300'}">
                        ${label}
                    </div>
                    ${i < allSteps.length - 1 ? `<div class="w-2 h-0.5 ${i < phase ? 'bg-slate-300' : 'bg-slate-100'} rounded"></div>` : ''}
                </div>`;
            });
            stepperHtml += `</div>`;

            // phaseがhc未満 → ヒントあり、hc以上 → ヒントなし
            const hintOn = phase < hc;

            let html = `
            <div class="min-h-screen bg-slate-100 flex flex-col items-center p-6 w-full">
                <div class="w-full max-w-4xl">
                    <div class="flex justify-between items-center mb-4 pt-2">
                        <!-- ★左上に戻るボタン＋設定⚙ボタン -->
                        <div class="flex gap-2">
                            <button onclick="goBackFromPractice(); playTone('tap')" class="p-3 bg-white rounded-full shadow-sm text-slate-400 hover:text-slate-600 transition-colors">
                                <i data-lucide="arrow-left" class="w-6 h-6"></i>
                            </button>
                            <button onclick="updateScreen('settings'); playTone('tap')" class="p-3 bg-white rounded-full shadow-sm text-slate-400 hover:text-indigo-500 transition-colors" title="練習の設定">
                                <i data-lucide="settings-2" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <div class="text-base font-bold text-slate-400">${state.practiceWordIndex + 1} / ${cat.words.length}</div>
                        <button onclick="handlePracticeSpeak()" class="flex items-center gap-2 px-5 py-3 bg-indigo-50 text-indigo-500 rounded-full text-sm font-bold shadow-sm">
                            <i data-lucide="ear" class="w-5 h-5"></i> きく
                        </button>
                    </div>

                    ${stepperHtml}

                    <div class="bg-white rounded-3xl shadow-lg p-8 mb-5 text-center relative overflow-hidden min-h-[260px] flex flex-col justify-center items-center">
                        <div class="text-8xl mb-3 select-none">${word.emoji}</div>
                        <p class="text-base text-slate-400 font-bold mb-1">Meaning</p>
                        <h2 class="text-4xl font-bold text-slate-700 mb-6">${word.jp}</h2>
                        <div class="flex flex-wrap justify-center gap-3 min-h-[90px] items-end pb-1 px-2">`;

            const sylMap = getSyllableMap(word.en);

            state.practiceAnswerSlots.forEach((letter, i) => {
                const targetChar = word.en[i];
                const isWrong = letter && letter.char !== targetChar;
                const isSpace = letter && letter.char === ' ';

                if (state.practiceIsCorrect) {
                    html += `<div class="font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-500 to-purple-600 animate-in zoom-in duration-500 px-0.5 ${sizeClass.text}">${isSpace ? '&nbsp;' : letter.char}</div>`;
                } else if (isSpace) {
                    html += `<div class="${sizeClass.box} flex items-end justify-center"></div>`;
                } else {
                    html += `
                    <button onclick="handlePracticeAnswerClick(${i})" ${!letter ? 'disabled' : ''} class="${sizeClass.box} ${sizeClass.text} rounded-lg flex items-end justify-center font-bold transition-all border-b-4 relative overflow-visible ${letter ? (isWrong ? 'text-red-500 border-red-300' : 'text-slate-700 border-slate-400 active:translate-y-1 active:border-b-0') : 'border-slate-200 border-dashed border-2'}">
                        ${!letter && hintOn ? (() => {
                            if (state.settings.colorCoding && sylMap) {
                                const si = sylMap[i] ?? 0;
                                const pastelColors = ['rgba(139,92,246,0.3)', 'rgba(244,63,94,0.3)', 'rgba(245,158,11,0.3)'];
                                return `<span style="color:${pastelColors[si % pastelColors.length]}" class="pointer-events-none font-black">${targetChar}</span>`;
                            }
                            return `<span class="text-slate-200 pointer-events-none">${targetChar}</span>`;
                        })() : ''}
                        ${letter ? letter.char : ''}
                        ${isWrong ? `<span class="absolute -top-3 -right-3 bg-white rounded-full shadow-sm z-20"><i data-lucide="alert-circle" class="w-5 h-5 text-red-500 fill-red-50"></i></span>` : ''}
                    </button>`;
                }
            });

            html += `</div></div>

                <div class="w-full p-2">
                    <p class="text-center text-slate-400 text-sm mb-4 font-bold tracking-widest">TAP</p>
                    <div class="flex flex-wrap justify-center gap-4">`;

            state.practicePoolLetters.forEach((letter) => {
                const isUsed = state.practiceAnswerSlots.some(l => l?.id === letter.id);
                html += `
                <div class="relative ${sizeClass.box}">
                    <button onclick="handlePracticePoolClick('${letter.id}')" ${isUsed || state.practiceIsCorrect ? 'disabled' : ''} class="absolute inset-0 w-full h-full bg-white rounded-xl flex items-end justify-center ${sizeClass.text} font-bold text-slate-700 shadow-md border-b-[5px] border-slate-200 active:border-b-0 active:translate-y-1 transition-all ${isUsed ? 'opacity-0 pointer-events-none' : 'opacity-100'}">
                        ${letter.char}
                    </button>
                    ${isUsed ? `<div class="absolute inset-0 rounded-xl border-2 border-slate-100 bg-slate-50/50"></div>` : ''}
                </div>`;
            });

            html += `</div></div></div></div>`;
            app.innerHTML = html;
            lucide.createIcons();
        }

        // ★ てがき画面
        // サブモード：なぞり（ガイド文字） / ヒントあり（上部にお手本） / ヒントなし（かけた後に正解表示）
        function renderTracing(currentUser) {
            const cat = DATA[state.wordListCategory];
            if (!cat) { updateScreen('home'); return; }
            const word = cat.words[state.practiceWordIndex];
            const mode = state.tracingMode;
            const isRevealed = state.tracingRevealed;
            const sylMap = getSyllableMap(word.en);

            // ── お手本スペル（ヒントあり mode）──
            // なぜ上部に置くか：キャンバスより前に見えることで書く手掛かりになるため
            const hintColors = ['#a78bfa', '#fb7185', '#fbbf24'];
            const hintHtml = mode === 'hint' ? (() => {
                const fontSize = word.en.length <= 4 ? '56px' : word.en.length <= 6 ? '48px' : word.en.length <= 8 ? '36px' : '28px';
                const spellingHtml = state.settings.colorCoding && sylMap
                    ? word.en.split('').map((ch, i) => `<span style="color:${hintColors[(sylMap[i] ?? 0) % 3]}">${ch}</span>`).join('')
                    : `<span class="text-white">${word.en}</span>`;
                return `
                <div class="bg-white/10 rounded-2xl py-3 px-6 mb-3 text-center border border-white/10 w-full max-w-[600px] mx-auto">
                    <div class="text-slate-400 text-xs font-black mb-1 tracking-widest">お手本</div>
                    <div class="font-black tracking-widest" style="font-size:${fontSize}; line-height:1.1;">${spellingHtml}</div>
                </div>`;
            })() : '';

            // ── キャンバス内ガイド文字（なぞり mode のみ）──
            const pastelColors = ['rgba(167,139,250,0.25)', 'rgba(251,113,133,0.22)', 'rgba(251,191,36,0.22)'];
            const guideFs = word.en.length <= 4 ? '100px' : word.en.length <= 6 ? '80px' : word.en.length <= 8 ? '64px' : word.en.length <= 10 ? '52px' : '40px';
            const guideContent = state.settings.colorCoding && sylMap
                ? word.en.split('').map((ch, i) => `<span style="color:${pastelColors[(sylMap[i] ?? 0) % 3]}">${ch}</span>`).join('')
                : `<span style="color:rgba(0,0,0,0.07)">${word.en}</span>`;
            const canvasGuide = mode === 'nazori'
                ? `<div class="absolute inset-0 flex items-center justify-center pointer-events-none select-none px-4"
                       style="font-size:${guideFs}; font-weight:900; letter-spacing:0.04em; z-index:1; white-space:nowrap;">
                       ${guideContent}
                   </div>`
                : '';

            // ── メインエリア：通常キャンバス or ヒントなし採点表示 ──
            let mainAreaHtml = '';
            if (mode === 'nohint' && isRevealed) {
                // 正解表示エリア（かけた！ボタン押下後）
                const revealFs = word.en.length <= 4 ? '60px' : word.en.length <= 6 ? '52px' : word.en.length <= 8 ? '40px' : '32px';
                mainAreaHtml = `
                <div class="w-full max-w-[600px] mx-auto flex flex-col gap-3">
                    ${state.tracingSnapshotUrl ? `
                    <div class="bg-white rounded-2xl overflow-hidden shadow-xl">
                        <div class="text-[10px] text-slate-400 text-center pt-1.5 pb-0.5 font-bold">あなたの てがき</div>
                        <img src="${state.tracingSnapshotUrl}" class="w-full object-contain" style="max-height:160px;">
                    </div>` : ''}
                    <div class="bg-white rounded-2xl p-5 text-center shadow-xl">
                        <div class="text-slate-400 text-sm font-bold mb-2">せいかい</div>
                        <div class="font-black text-indigo-600 tracking-wide" style="font-size:${revealFs}; line-height:1.1;">${word.en}</div>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="tracingRetry()" class="flex-1 py-4 rounded-2xl bg-slate-600 text-white font-black text-lg hover:bg-slate-500 active:scale-95 transition-all flex items-center justify-center gap-2">
                            🔄 なおす
                        </button>
                        <button onclick="tracingCorrect()" class="flex-1 py-4 rounded-2xl bg-green-500 text-white font-black text-lg hover:bg-green-400 active:scale-95 transition-all shadow-lg flex items-center justify-center gap-2">
                            ✅ あってる
                        </button>
                    </div>
                </div>`;
            } else {
                // 通常キャンバス
                mainAreaHtml = `
                <div class="w-full flex justify-center">
                    <div class="relative bg-white rounded-3xl shadow-2xl overflow-hidden w-full max-w-[600px]" style="height: 280px;">
                        ${canvasGuide}
                        <canvas id="tracingCanvas" class="absolute inset-0 w-full h-full" style="z-index:2; touch-action:none;"></canvas>
                    </div>
                </div>`;
            }

            // ── アクションボタン（右上に配置） ──
            let actionBtnHtml = '';
            if (!isRevealed) {
                if (mode === 'nohint') {
                    // ヒントなし：「かけた！」ボタン→採点へ
                    actionBtnHtml = `
                    <button onclick="revealTracingAnswer()" class="py-2.5 px-6 rounded-2xl bg-indigo-500 text-white font-bold text-lg hover:bg-indigo-400 transition-colors shadow-lg flex items-center gap-2">
                        <i data-lucide="check" class="w-5 h-5"></i> かけた！
                    </button>`;
                } else {
                    // なぞり / ヒントあり：「できた！」ボタン→保存
                    actionBtnHtml = `
                    <button onclick="saveTracing()" class="py-2.5 px-6 rounded-2xl bg-indigo-500 text-white font-bold text-lg hover:bg-indigo-400 transition-colors shadow-lg flex items-center gap-2">
                        <i data-lucide="sparkles" class="w-5 h-5"></i> できた！
                    </button>`;
                }
            }

            let html = `
            <div class="min-h-screen bg-slate-800 flex flex-col p-5 w-full">

                <!-- ヘッダー -->
                <div class="flex items-center justify-between w-full max-w-5xl mx-auto mb-4">
                    <div class="flex items-center gap-4">
                        <div class="text-5xl">${word.emoji}</div>
                        <div>
                            <div class="text-white font-black text-xl">✏️ てがき</div>
                            <div class="text-slate-300 text-base font-bold">${stripHtml(word.jp)}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        ${!isRevealed ? `
                        <button onclick="clearTracing()" class="py-2.5 px-4 rounded-2xl bg-slate-600 text-white font-bold hover:bg-slate-500 transition-colors flex items-center gap-2">
                            <i data-lucide="eraser" class="w-5 h-5"></i> けす
                        </button>` : ''}
                        ${actionBtnHtml}
                        <button onclick="skipTracing()" class="py-2.5 px-3 text-slate-400 font-bold hover:text-slate-300 transition-colors text-sm">
                            スキップ →
                        </button>
                    </div>
                </div>

                <!-- サブモードタブ -->
                <div class="flex gap-2 mb-4 bg-slate-700/60 rounded-2xl p-1.5 w-full max-w-5xl mx-auto">
                    <button onclick="setTracingMode('nazori')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition-all
                        ${mode === 'nazori' ? 'bg-indigo-500 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                        📋 なぞり
                    </button>
                    <button onclick="setTracingMode('hint')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition-all
                        ${mode === 'hint' ? 'bg-yellow-400 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                        🌟 ヒントあり
                    </button>
                    <button onclick="setTracingMode('nohint')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition-all
                        ${mode === 'nohint' ? 'bg-green-500 text-white shadow-sm' : 'text-slate-400 hover:text-slate-200'}">
                        💪 ヒントなし
                    </button>
                </div>

                <!-- メインエリア -->
                <div class="w-full max-w-5xl mx-auto flex flex-col gap-3">
                    ${hintHtml}
                    ${mainAreaHtml}
                </div>

            </div>`;

            app.innerHTML = html;
            lucide.createIcons();
            // キャンバスが表示されているときだけ初期化する
            if (!isRevealed) {
                setTimeout(initTracingCanvas, 100);
            }
        }

        // ★ カルタ画面
        function renderKaruta(currentUser) {
            const cat = DATA[state.karutaCategory];
            if (!cat) { updateScreen('home'); return; }
            const words = state.karutaWords;
            const remaining = words.length - state.karutaCleared.length;
            let html = `
            <div class="min-h-screen bg-slate-100 w-full flex flex-col p-4">
                <div class="max-w-5xl mx-auto w-full flex flex-col flex-1">
                    <div class="flex justify-between items-center mb-3">
                        <button onclick="updateScreen('wordList'); playTone('tap')" class="p-3 bg-white rounded-full shadow-sm text-slate-400 hover:text-slate-600">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                        <div class="text-center">
                            <div class="text-base font-bold text-slate-500">🃏 カルタ</div>
                            <div class="text-sm font-bold text-slate-400">のこり <span class="text-2xl text-indigo-500 font-black">${remaining}</span> まい</div>
                        </div>
                        <button onclick="toggleKarutaHint()" class="flex items-center gap-2 px-4 py-2 rounded-full font-bold text-sm transition-all shadow-sm ${state.karutaHint ? 'bg-yellow-100 text-yellow-600 border-2 border-yellow-300' : 'bg-white text-slate-400 border-2 border-slate-200'}">
                            <i data-lucide="lightbulb" class="w-5 h-5 ${state.karutaHint ? 'fill-yellow-400 text-yellow-400' : ''}"></i> ヒント
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl shadow-md p-4 mb-4 text-center border-4 ${state.karutaDone ? 'border-indigo-300' : 'border-slate-100'}">
                        ${state.karutaDone
                            ? `<div class="py-2"><div class="text-4xl mb-1">🎉</div><div class="text-xl font-black text-indigo-600">コンプリート！</div></div>`
                            : state.karutaCurrentIdx >= 0
                                ? `<div class="text-base font-bold text-slate-400 mb-2">これをさがそう！</div>
                                   <button onclick="karutaReadCurrent()" class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-500 text-white rounded-full font-bold text-lg shadow-md hover:bg-indigo-400 active:scale-95 transition-all">
                                       <i data-lucide="volume-2" class="w-6 h-6"></i> もう一度きく
                                   </button>`
                                : `<div class="text-slate-400 font-bold text-base">↓ カードをタップしてスタート！</div>`
                        }
                    </div>`;
            if (state.karutaDone) {
                html += `
                    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/30 backdrop-blur-sm animate-modal-in">
                        <div class="bg-white rounded-3xl p-10 text-center shadow-2xl border-4 border-indigo-200 mx-6">
                            <div class="text-7xl mb-4">🎉</div>
                            <div class="text-3xl font-black text-indigo-600 mb-2">コンプリート！</div>
                            <div class="text-slate-400 font-bold mb-8">ぜんぶ みつけたね！</div>
                            <div class="flex gap-4">
                                <button onclick="startKaruta('${cat.id}')" class="flex-1 py-4 rounded-xl bg-indigo-500 text-white font-bold text-lg shadow-md hover:bg-indigo-400 transition-colors">もういちど</button>
                                <button onclick="updateScreen('wordList'); playTone('tap')" class="flex-1 py-4 rounded-xl bg-slate-200 text-slate-700 font-bold text-lg shadow-md hover:bg-slate-300 transition-colors">一覧へ</button>
                            </div>
                        </div>
                    </div>`;
            } else {
                const cols = words.length <= 6 ? 3 : 4;
                html += `<div class="grid gap-3" style="grid-template-columns: repeat(${cols}, 1fr);">`;
                words.forEach((word, i) => {
                    const isCleared = state.karutaCleared.includes(i);
                    html += `
                    <button onclick="karutaTap(${i})" ${isCleared ? 'disabled' : ''}
                        class="rounded-2xl font-bold flex flex-col items-center justify-center gap-1 p-3 transition-all border-4 select-none
                            ${isCleared ? 'bg-indigo-100 border-indigo-200 opacity-40 scale-95 aspect-square' : 'bg-white border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-200 active:scale-95 aspect-square'}">
                        ${isCleared
                            ? `<div class="text-3xl">✅</div>`
                            : `<div class="text-3xl">${word.emoji}</div>
                               <div class="text-sm font-bold text-slate-500 truncate w-full text-center leading-tight">${stripHtml(word.jp)}</div>
                               ${state.karutaHint ? `<div class="text-base font-black text-indigo-600 truncate w-full text-center">${word.en}</div>` : ''}`
                        }
                    </button>`;
                });
                html += `</div>`;
            }
            html += `</div></div>`;
            app.innerHTML = html;
            lucide.createIcons();
            if (state.karutaCurrentIdx >= 0 && !state.karutaDone) {
                setTimeout(() => speak(words[state.karutaCurrentIdx].en), 300);
            }
        }

        // ★ テストモード
        function renderTest() {
            const cat = DATA[state.testCategory];
            if (!cat && state.testCategory !== 'challenge_test') { updateScreen('home'); return; }
            const word = state.testWords[state.testWordIndex];
            const total = state.testWords.length;
            const current = state.testWordIndex + 1;
            const isType = state.testInputMode === 'type';
            let html = `
            <div class="min-h-screen bg-slate-800 flex flex-col p-5 w-full">
                <div class="max-w-3xl mx-auto w-full flex flex-col flex-1">
                    <div class="flex justify-between items-center mb-4">
                        <button onclick="updateScreen('wordList'); playTone('tap')" class="p-3 bg-slate-700 rounded-full text-slate-300 hover:text-white transition-colors">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                        <div class="text-center">
                            <div class="text-slate-400 text-sm font-bold">📝 テスト</div>
                            <div class="text-white font-black text-lg">${current} / ${total}</div>
                        </div>
                        <div class="flex bg-slate-700 rounded-xl p-1 gap-1">
                            <button onclick="setTestInputMode('canvas')" class="px-3 py-2 rounded-lg font-bold text-sm transition-all ${!isType ? 'bg-white text-slate-700' : 'text-slate-400'}">✏️ 手書き</button>
                            <button onclick="setTestInputMode('type')" class="px-3 py-2 rounded-lg font-bold text-sm transition-all ${isType ? 'bg-white text-slate-700' : 'text-slate-400'}">⌨️ タイプ</button>
                        </div>
                    </div>
                    <div class="bg-white rounded-3xl p-5 mb-4 text-center">
                        <div class="text-6xl mb-2">${word.emoji}</div>
                        <div class="text-3xl font-bold text-slate-700">${word.jp}</div>
                    </div>
                    ${!state.testRevealed ? `
                        ${isType ? `
                        <div class="bg-slate-700 rounded-2xl p-4 mb-4">

                    </div>`;

            if (state.stampBookPage === 1) {
                html += `
                    <div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border-2 border-amber-100">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-sm font-bold text-amber-800">あつめた数</span>

                    </div>
                    <div class="bg-white rounded-3xl p-4 shadow-xl border-4 border-amber-200 min-h-[500px] relative overflow-hidden">
                        <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 relative z-10 pb-4">`;
                Object.values(DATA).forEach(cat => {
                    const p = progress[cat.id] || { perfectCount: 0, stamp: null };
                    const hasStamp = !!p.stamp;
                    const remaining = Math.max(0, 3 - p.perfectCount);
                    html += `
                    <div class="flex flex-col items-center group">
                        <div class="aspect-square w-full rounded-lg border-2 flex items-center justify-center relative bg-slate-50 transition-all ${hasStamp ? 'border-amber-300 bg-amber-50 shadow-sm' : 'border-dashed border-slate-200 opacity-70'}">
                            ${hasStamp
                                ? `<div class="text-3xl animate-shine drop-shadow-sm filter">${p.stamp}</div>`
                                : `<div class="text-center w-full">${p.perfectCount > 0 ? `<div class="text-[10px] font-bold text-amber-500 bg-amber-100 rounded-full px-1 mx-1">あと${remaining}</div>` : ''}<div class="opacity-20 text-xl grayscale mt-0.5">${cat.words[0].emoji}</div></div>`
                            }
                        </div>
                        <div class="text-[9px] font-bold text-slate-400 mt-1 w-full text-center truncate leading-tight tracking-tighter">${cat.label.split('(')[0].replace(/[0-9①②]/g, '')}</div>
                    </div>`;
                });
                html += `</div></div>`;
            } else {
                const year = state.calendarYear;
                const month = state.calendarMonth;
                const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
                const dayNames = ['日','月','火','水','木','金','土'];
                const firstDayOfWeek = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const dateMap = {};
                (history || []).forEach(record => {
                    const dateStr = record.date.split(' ')[0];
                    const parts = dateStr.split('/');
                    const recYear = parseInt(parts[0]);
                    const recMonth = parseInt(parts[1]) - 1;
                    const recDay = parseInt(parts[2]);
                    if (recYear === year && recMonth === month) {
                        const key = recDay;
                        if (!dateMap[key]) dateMap[key] = [];
                        if (record.categoryId === 'challenge_mode') {
                            if (!dateMap[key].includes('🔥')) dateMap[key].push('🔥');
                        } else {
                            const emoji = DATA[record.categoryId]?.words[0]?.emoji;
                            if (emoji && !dateMap[key].includes(emoji)) dateMap[key].push(emoji);
                        }
                    }
                });
                const today = new Date();
                const isCurrentMonth = (today.getFullYear() === year && today.getMonth() === month);
                const todayDay = isCurrentMonth ? today.getDate() : -1;
                html += `
                    <div class="bg-white rounded-3xl shadow-xl border-4 border-amber-200 overflow-hidden">
                        <div class="flex items-center justify-between px-4 py-3 bg-amber-400">

                        </div>

                        </div>
                        <div class="grid grid-cols-7 p-2 gap-1">`;
                for (let i = 0; i < firstDayOfWeek; i++) html += `<div class="aspect-square"></div>`;
                for (let day = 1; day <= daysInMonth; day++) {
                    const dayOfWeek = (firstDayOfWeek + day - 1) % 7;
                    const isToday = (day === todayDay);
                    const dayEmojis = dateMap[day] || [];
                    const hasRecord = dayEmojis.length > 0;
                    const textColor = dayOfWeek === 0 ? 'text-red-500' : dayOfWeek === 6 ? 'text-blue-500' : 'text-slate-700';
                    const bgStyle = isToday ? 'bg-amber-100 border-2 border-amber-400 shadow-sm' : hasRecord ? 'bg-green-50 border border-green-200' : 'bg-slate-50 border border-slate-100';
                    html += `
                        <div class="rounded-lg p-0.5 flex flex-col items-center min-h-[3rem] ${bgStyle}">
                            <div class="text-[10px] font-bold ${textColor} ${isToday ? 'bg-amber-400 text-white w-4 h-4 rounded-full flex items-center justify-center text-[9px]' : ''}">${day}</div>
                            ${hasRecord ? `<div class="flex flex-wrap justify-center gap-0 mt-0.5">${dayEmojis.slice(0, 3).map(e => `<span class="text-sm leading-tight">${e}</span>`).join('')}${dayEmojis.length > 3 ? `<span class="text-[8px] font-bold text-slate-400">+${dayEmojis.length-3}</span>` : ''}</div>` : ''}
                        </div>`;
                }
                html += `</div>`;
                const monthTotal = (history || []).filter(r => { const parts = r.date.split(' ')[0].split('/'); return parseInt(parts[0]) === year && parseInt(parts[1]) - 1 === month; }).length;
                html += `
                        <div class="px-4 py-3 bg-amber-50 border-t border-amber-100 flex items-center justify-between">
                            <span class="text-sm font-bold text-amber-700">この月のがんばり</span>
                            <span class="text-xl font-black text-amber-600">${monthTotal}<span class="text-sm font-bold text-amber-400"> かい</span></span>
                        </div>
                    </div>`;
            }
            html += `</div></div>`;
            app.innerHTML = html;
        }

        // ★ 単語カードをタップ → 練習モード開始
        // フェーズ構成：🌟×hintCount → 💪×noHintCount → ✏️なぞり
        function startWordPractice(catId, wordIndex) {
            state.wordListCategory = catId;
            state.practiceWordIndex = wordIndex;
            state.practicePhase = 0;
            // てがき画面の状態をリセット
            state.tracingMode = 'nazori';
            state.tracingRevealed = false;
            state.tracingSnapshotUrl = null;
            state.tracingStrokes = [];
            const hc = state.settings.hintCount;
            const nc = state.settings.noHintCount;
            if (hc === 0 && nc === 0) {
                // 両方0ならいきなりなぞりへ
                state.tracingStrokes = [];
                updateScreen('tracing');
            } else {
                loadPracticeQuestion();
                updateScreen('wordPractice');
            }
        }

        function loadPracticeQuestion(autoSpeak = true) {
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const targetWord = word.en;
            const letters = targetWord.split('').map((char, i) => ({ char, id: `${char}-${i}-${Math.random()}` }));
            state.practicePoolLetters = letters.filter(l => l.char !== ' ').sort(() => Math.random() - 0.5);
            state.practiceAnswerSlots = letters.map(l => l.char === ' ' ? l : null);
            state.practiceIsCorrect = false;
            if (autoSpeak) setTimeout(() => speak(targetWord), 300);
        }

        // ★ 練習フェーズ進行
        // なぜこうなるか：phaseが totalPhases（hc+nc）に達したらなぞりへ
        function nextPracticePhase() {
            state.practicePhase++;
            const hc = state.settings.hintCount;
            const nc = state.settings.noHintCount;
            const totalPhases = hc + nc;
            if (state.practicePhase < totalPhases) {
                loadPracticeQuestion(false);
                updateScreen('wordPractice');
                const cat = DATA[state.wordListCategory];
                const word = cat.words[state.practiceWordIndex];
                setTimeout(() => speak(word.en), 800);
            } else {
                // てがき画面へ（状態リセット）
                state.tracingStrokes = [];
                state.tracingRevealed = false;
                state.tracingSnapshotUrl = null;
                updateScreen('tracing');
            }
        }

        function handlePracticePoolClick(letterId) {
            if (state.practiceIsCorrect) return;
            const letter = state.practicePoolLetters.find(l => l.id === letterId);
            if (!letter) return;
            if (state.practiceAnswerSlots.some(l => l?.id === letter.id)) return;
            const firstEmptyIndex = state.practiceAnswerSlots.findIndex(slot => slot === null);
            if (firstEmptyIndex === -1) return;
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const targetChar = word.en[firstEmptyIndex];
            if (letter.char !== targetChar) { playTone('error'); } else { playTone('tap'); }
            state.practiceAnswerSlots[firstEmptyIndex] = letter;
            renderWordPractice();
            checkPracticeAnswer();
        }

        function handlePracticeAnswerClick(index) {
            if (state.practiceIsCorrect) return;
            const slot = state.practiceAnswerSlots[index];
            if (slot && slot.char === ' ') return;
            playTone('remove');
            state.practiceAnswerSlots[index] = null;
            renderWordPractice();
        }

        function checkPracticeAnswer() {
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const targetWord = word.en;
            const currentAnswer = state.practiceAnswerSlots.map(l => l ? l.char : '').join('');
            if (state.practiceAnswerSlots.every(s => s !== null) && currentAnswer === targetWord) {
                playTone('correct');
                state.practiceIsCorrect = true;
                renderWordPractice();
                const praiseWords = ["Great!", "Nice!", "Good job!", "Awesome!", "Perfect!", "Well done!"];
                setTimeout(() => speak(praiseWords[Math.floor(Math.random() * praiseWords.length)]), 300);
                setTimeout(() => nextPracticePhase(), 1200);
            }
        }

        // なぞりキャンバスの初期化
        function initTracingCanvas() {
            const canvas = document.getElementById('tracingCanvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            // ★ saveTracing 時にキャンバスが DOM から消えても寸法を使えるよう保存
            state.tracingCanvasW = canvas.width;
            state.tracingCanvasH = canvas.height;
            redrawTracing();
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); const pt = getTouchPoint(e.touches[0], canvas); state.tracingStrokes.push([pt]); state.isTracingDrawing = true; }, { passive: false });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if (!state.isTracingDrawing) return; state.tracingStrokes[state.tracingStrokes.length - 1].push(getTouchPoint(e.touches[0], canvas)); redrawTracing(); }, { passive: false });
            canvas.addEventListener('touchend', () => { state.isTracingDrawing = false; });
            canvas.addEventListener('mousedown', (e) => { state.tracingStrokes.push([getMousePoint(e, canvas)]); state.isTracingDrawing = true; });
            canvas.addEventListener('mousemove', (e) => { if (!state.isTracingDrawing) return; state.tracingStrokes[state.tracingStrokes.length - 1].push(getMousePoint(e, canvas)); redrawTracing(); });
            canvas.addEventListener('mouseup', () => { state.isTracingDrawing = false; });
            canvas.addEventListener('mouseleave', () => { state.isTracingDrawing = false; });
        }

        function getTouchPoint(touch, canvas) { const rect = canvas.getBoundingClientRect(); return { x: touch.clientX - rect.left, y: touch.clientY - rect.top }; }
        function getMousePoint(e, canvas) { const rect = canvas.getBoundingClientRect(); return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }
        function redrawTracing() {
            const canvas = document.getElementById('tracingCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#3730a3'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            state.tracingStrokes.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
                ctx.stroke();
            });
        }
        function clearTracing() { state.tracingStrokes = []; redrawTracing(); }

        // なぞりを保存して一覧に反映
        // ★ キャンバスが DOM にない場合（ヒントなし→あってる経由）は保存済みサイズを使う
        function saveTracing() {
            const canvas = document.getElementById('tracingCanvas');
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            const lw = 6;
            const w = canvas ? canvas.width : state.tracingCanvasW;
            const h = canvas ? canvas.height : state.tracingCanvasH;
            const paths = state.tracingStrokes.map(stroke => {
                if (stroke.length < 2) return '';
                let d = `M ${stroke[0].x.toFixed(1)} ${stroke[0].y.toFixed(1)}`;
                for (let i = 1; i < stroke.length; i++) d += ` L ${stroke[i].x.toFixed(1)} ${stroke[i].y.toFixed(1)}`;
                return `<path d="${d}" stroke="#3730a3" stroke-width="${lw.toFixed(1)}" stroke-linecap="round" stroke-linejoin="round" fill="none"/>`;
            }).filter(Boolean).join('');
            const svgData = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" style="width:100%;height:100%">${paths}</svg>`;
            if (state.currentUserId && paths) {
                saveBestShot(state.currentUserId, word.en, svgData);
                playTone('complete');
            }
            updateScreen('wordList');
        }
        function skipTracing() { playTone('tap'); updateScreen('wordList'); }

        // ★ てがきサブモード切り替え
        // タブをタップするたびにキャンバスをリセットして切り替える
        function setTracingMode(mode) {
            playTone('tap');
            state.tracingMode = mode;
            state.tracingRevealed = false;
            state.tracingSnapshotUrl = null;
            state.tracingStrokes = [];
            render();
            // render → renderTracing → setTimeout(initTracingCanvas, 100) が自動で呼ばれる
        }

        // ★ ヒントなしモード：「かけた！」ボタン
        // キャンバスの画像を snapshot として保存し、正解表示モードへ
        function revealTracingAnswer() {
            playTone('tap');
            const canvas = document.getElementById('tracingCanvas');
            state.tracingSnapshotUrl = canvas ? canvas.toDataURL() : null;
            state.tracingRevealed = true;
            // 正解のスペルを読み上げ
            const cat = DATA[state.wordListCategory];
            const word = cat.words[state.practiceWordIndex];
            speak(word.en);
            render();
        }

        // ★ ヒントなしモード：「なおす」ボタン
        // キャンバスをリセットしてもう一度書き直す
        function tracingRetry() {
            playTone('remove');
            state.tracingStrokes = [];
            state.tracingRevealed = false;
            state.tracingSnapshotUrl = null;
            render();
            // render → renderTracing → setTimeout(initTracingCanvas, 100) で自動再初期化
        }

        // ★ ヒントなしモード：「あってる」ボタン
        // ストロークは state.tracingStrokes に残っているので saveTracing に流す
        function tracingCorrect() {
            saveTracing();
        }

        // カルタ関連
        function startKaruta(catId) {
            playTone('tap');
            const cat = DATA[catId];
            const shuffled = [...cat.words].sort(() => Math.random() - 0.5);
            state.karutaCategory = catId;
            state.karutaWords = shuffled;
            state.karutaCleared = [];
            state.karutaDone = false;
            state.karutaHint = false;
            state.karutaCurrentIdx = Math.floor(Math.random() * shuffled.length);
            updateScreen('karuta');
        }
        function karutaReadCurrent() { playTone('tap'); if (state.karutaCurrentIdx >= 0 && !state.karutaDone) speak(state.karutaWords[state.karutaCurrentIdx].en); }
        function toggleKarutaHint() { playTone('hint'); state.karutaHint = !state.karutaHint; render(); }
        function launchKarutaParticles() {
            const colors = ['#f59e0b','#10b981','#6366f1','#ec4899','#f97316','#3b82f6','#a78bfa','#34d399'];
            for (let i = 0; i < 80; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.className = 'karuta-particle';
                    el.style.left = (Math.random() * 100) + 'vw';
                    el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    el.style.width = (8 + Math.random() * 10) + 'px';
                    el.style.height = (8 + Math.random() * 10) + 'px';
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    const duration = 1.5 + Math.random() * 2;
                    el.style.animationDuration = duration + 's';
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), duration * 1000 + 100);
                }, i * 30);
            }
        }
        function karutaTap(idx) {
            if (state.karutaDone || state.karutaCleared.includes(idx)) return;
            if (idx === state.karutaCurrentIdx) {
                playTone('correct');
                state.karutaCleared.push(idx);
                const remaining = state.karutaWords.length - state.karutaCleared.length;
                if (remaining === 0) {
                    state.karutaDone = true;
                    render();
                    setTimeout(() => { playTone('perfect'); launchKarutaParticles(); }, 200);
                } else {
                    const unclearedIndices = state.karutaWords.map((_, i) => i).filter(i => !state.karutaCleared.includes(i));
                    state.karutaCurrentIdx = unclearedIndices[Math.floor(Math.random() * unclearedIndices.length)];
                    render();
                    setTimeout(() => speak(state.karutaWords[state.karutaCurrentIdx].en), 600);
                }
            } else {
                playTone('error');
                const btn = app.querySelectorAll('button[onclick^="karutaTap"]')[idx];
                if (btn) { btn.classList.add('animate-shake'); setTimeout(() => btn.classList.remove('animate-shake'), 400); }
            }
        }

        // テスト関連
        function startChallengeTest() {
            playTone('tap');
            const user = state.allUsersData[state.currentUserId];
            if (!user || !user.challengeTestWords || user.challengeTestWords.length === 0) return;
            state.testCategory = 'challenge_test';
            state.testWords = [...user.challengeTestWords].sort(() => Math.random() - 0.5);
            state.testWordIndex = 0; state.testRevealed = false; state.testInput = '';
            state.testStrokes = []; state.testSnapshotUrl = null; state.testResults = [];
            updateScreen('test');
        }
        function startTest(catId) {
            playTone('tap');
            const cat = DATA[catId];
            state.testCategory = catId;
            state.testWords = [...cat.words].sort(() => Math.random() - 0.5);
            state.testWordIndex = 0; state.testRevealed = false; state.testInput = '';
            state.testStrokes = []; state.testSnapshotUrl = null; state.testResults = [];
            updateScreen('test');
        }
        function setTestInputMode(mode) { playTone('tap'); state.testInputMode = mode; state.testInput = ''; state.testStrokes = []; render(); }
        function testReveal() {
            if (state.testInputMode === 'canvas') {
                const canvas = document.getElementById('testCanvas');
                state.testSnapshotUrl = canvas ? canvas.toDataURL() : null;
            }
            state.testRevealed = true;
            speak(state.testWords[state.testWordIndex].en);
            render();
        }
        function testNext(isCorrect) {
            playTone(isCorrect ? 'correct' : 'tap');
            const word = state.testWords[state.testWordIndex];
            state.testResults.push({ word, correct: isCorrect });
            if (state.currentUserId) {
                const user = state.allUsersData[state.currentUserId];
                if (user) {
                    if (!user.challengeTestWords) user.challengeTestWords = [];
                    if (state.testCategory === 'challenge_test') {
                        if (isCorrect) user.challengeTestWords = user.challengeTestWords.filter(w => w.en !== word.en);
                    } else {
                        if (!isCorrect) {
                            const exists = user.challengeTestWords.some(w => w.en === word.en);
                            if (!exists) user.challengeTestWords.push(word);
                        }
                    }
                    saveData();
                }
            }
            state.testWordIndex++;
            state.testRevealed = false; state.testInput = ''; state.testStrokes = []; state.testSnapshotUrl = null;
            if (state.testWordIndex >= state.testWords.length) { updateScreen('testResult'); } else { render(); }
        }
        function initTestCanvas() {
            const canvas = document.getElementById('testCanvas');
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            redrawTestCanvas();
            const getPos = (e, canvas) => { const r = canvas.getBoundingClientRect(); const src = e.touches ? e.touches[0] : e; return { x: src.clientX - r.left, y: src.clientY - r.top }; };
            canvas.addEventListener('touchstart', e => { e.preventDefault(); state.testStrokes.push([getPos(e, canvas)]); state.testIsDrawing = true; }, { passive: false });
            canvas.addEventListener('touchmove', e => { e.preventDefault(); if (!state.testIsDrawing) return; state.testStrokes[state.testStrokes.length - 1].push(getPos(e, canvas)); redrawTestCanvas(); }, { passive: false });
            canvas.addEventListener('touchend', () => { state.testIsDrawing = false; });
            canvas.addEventListener('mousedown', e => { state.testStrokes.push([getPos(e, canvas)]); state.testIsDrawing = true; });
            canvas.addEventListener('mousemove', e => { if (!state.testIsDrawing) return; state.testStrokes[state.testStrokes.length - 1].push(getPos(e, canvas)); redrawTestCanvas(); });
            canvas.addEventListener('mouseup', () => { state.testIsDrawing = false; });
            canvas.addEventListener('mouseleave', () => { state.testIsDrawing = false; });
        }
        function redrawTestCanvas() {
            const canvas = document.getElementById('testCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            state.testStrokes.forEach(stroke => {
                if (stroke.length < 2) return;
                ctx.beginPath(); ctx.moveTo(stroke[0].x, stroke[0].y);
                for (let i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x, stroke[i].y);
                ctx.stroke();
            });
        }
        function clearTestCanvas() { state.testStrokes = []; redrawTestCanvas(); }

        // スタンプブック関連
        function getStamp(stamp) {
            const user = state.allUsersData[state.currentUserId];
            if (user.progress[state.currentCategory]) user.progress[state.currentCategory].stamp = stamp;
            saveData(); playTone('stamp');
            state.stampBookPage = 1;
            updateScreen('stampBook');
        }
        function setStampBookPage(page) { playTone('tap'); state.stampBookPage = page; render(); }
        function navigateCalendar(delta) {
            playTone('tap');
            state.calendarMonth += delta;
            if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
            if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
            render();
        }
        function goToCalendar() { playTone('tap'); state.stampBookPage = 2; state.calendarYear = new Date().getFullYear(); state.calendarMonth = new Date().getMonth(); updateScreen('stampBook'); }
        function clearHistory() {
            if (!confirm('ほんとうに きろくを ぜんぶ けしますか？')) return;
            state.allUsersData[state.currentUserId].history = [];
            saveData(); playTone('remove'); render();
        }

        // フラッシュカード（ゲーム）ロジック
        function loadQuestion(catId, index) {
            let cat;
            if (catId === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords || [] };
            } else {
                cat = DATA[catId];
            }
            const targetWord = cat.words[index].en;
            const letters = targetWord.split('').map((char, i) => ({ char, id: `${char}-${i}-${Math.random()}` }));
            state.poolLetters = letters.filter(l => l.char !== ' ').sort(() => Math.random() - 0.5);
            state.answerSlots = letters.map(l => l.char === ' ' ? l : null);
            state.isCorrect = false;
            state.currentWordHadError = false;
            state.currentWordUsedHint = state.showHint;
            setTimeout(() => speak(targetWord), 500);
        }

        function handlePoolClick(letterId) {
            if (state.isCorrect) return;
            const letter = state.poolLetters.find(l => l.id === letterId);
            if (!letter || state.answerSlots.some(l => l?.id === letter.id)) return;
            const firstEmptyIndex = state.answerSlots.findIndex(slot => slot === null);
            if (firstEmptyIndex === -1) return;
            let cat;
            if (state.currentCategory === 'challenge_mode') { cat = { words: state.allUsersData[state.currentUserId].challengeWords }; } else { cat = DATA[state.currentCategory]; }
            const targetChar = cat.words[state.questionIndex].en[firstEmptyIndex];
            if (letter.char !== targetChar) { state.currentWordHadError = true; playTone('error'); } else { playTone('tap'); }
            state.answerSlots[firstEmptyIndex] = letter;
            render();
            checkAnswer();
        }
        function handleAnswerClick(index) {
            if (state.isCorrect) return;
            const slot = state.answerSlots[index];
            if (slot && slot.char === ' ') return;
            playTone('remove');
            state.answerSlots[index] = null;
            render();
        }
        function toggleHint() {
            if (!state.showHint) { playTone('hint'); state.showHint = true; state.currentWordUsedHint = true; render(); }
            else { state.showHint = false; render(); }
        }
        function handleSpeak() {
            let cat;
            if (state.currentCategory === 'challenge_mode') { cat = { words: state.allUsersData[state.currentUserId].challengeWords }; } else { cat = DATA[state.currentCategory]; }
            speak(cat.words[state.questionIndex].en);
        }
        function checkAnswer() {
            let cat;
            if (state.currentCategory === 'challenge_mode') { cat = { words: state.allUsersData[state.currentUserId].challengeWords }; } else { cat = DATA[state.currentCategory]; }
            const targetWord = cat.words[state.questionIndex].en;
            const currentAnswer = state.answerSlots.map(l => l ? l.char : '').join('');
            if (state.answerSlots.every(s => s !== null) && currentAnswer === targetWord) {
                playTone('correct');
                state.isCorrect = true;
                if (!state.currentWordUsedHint && !state.currentWordHadError) {
                    state.sessionPerfectWordCount++;
                } else if (!state.currentWordUsedHint && state.currentWordHadError) {
                    if (state.currentCategory !== 'challenge_mode') {
                        const alreadyIn = state.sessionErrorWords.some(w => w.en === cat.words[state.questionIndex].en);
                        if (!alreadyIn) state.sessionErrorWords.push(cat.words[state.questionIndex]);
                    }
                }
                render();
                setTimeout(() => speak("Great! " + targetWord), 300);
            }
        }
        function nextQuestion() {
            playTone('tap');
            let cat;
            if (state.currentCategory === 'challenge_mode') { cat = { words: state.allUsersData[state.currentUserId].challengeWords }; } else { cat = DATA[state.currentCategory]; }
            if (state.currentCategory === 'challenge_mode' && state.isCorrect) {
                if (!state.currentWordUsedHint && !state.currentWordHadError) {
                    const solvedWordEn = cat.words[state.questionIndex].en;
                    const user = state.allUsersData[state.currentUserId];
                    user.challengeWords = user.challengeWords.filter(w => w.en !== solvedWordEn);
                    state.questionIndex--;
                    saveData();
                }
            }
            let currentWordsLength = 0;
            if (state.currentCategory === 'challenge_mode') {
                currentWordsLength = state.allUsersData[state.currentUserId].challengeWords.length;
            } else {
                currentWordsLength = DATA[state.currentCategory].words.length;
            }
            if (state.questionIndex + 1 < currentWordsLength) {
                state.questionIndex++;
                loadQuestion(state.currentCategory, state.questionIndex);
                render();
            } else {
                let accuracy = currentWordsLength > 0 ? Math.round((state.sessionPerfectWordCount / currentWordsLength) * 100) : 100;
                const isPass = accuracy >= 90;
                const isPerfect = accuracy === 100;
                if (isPerfect) { playTone('perfect'); } else { playTone('complete'); }
                const now = new Date();
                const today = now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'});
                const user = state.allUsersData[state.currentUserId];
                user.history.unshift({ date: today, categoryId: state.currentCategory, isPass });
                if (user.history.length > HISTORY_LIMIT) user.history = user.history.slice(0, HISTORY_LIMIT);
                if (state.currentCategory !== 'challenge_mode') {
                    state.sessionErrorWords.forEach(word => {
                        const exists = user.challengeWords.some(w => w.en === word.en);
                        if (!exists) user.challengeWords.push(word);
                    });
                }
                let canGetStamp = false;
                let gotExtraBadge = false;
                const catId = state.currentCategory;
                if (catId !== 'challenge_mode') {
                    if (!user.progress[catId]) user.progress[catId] = { perfectCount: 0, stamp: null, extraBadgeCount: 0 };
                    if (user.progress[catId].extraBadgeCount === undefined) user.progress[catId].extraBadgeCount = 0;
                    if (!user.progress[catId].stamp) {
                        if (isPass) {
                            user.progress[catId].perfectCount += 1;
                            if (user.progress[catId].perfectCount >= 3) { canGetStamp = true; setTimeout(() => playTone('crown'), 1500); }
                        }
                    } else {
                        const MAX_EXTRA_BADGES = 4;
                        if (isPerfect && user.progress[catId].extraBadgeCount < MAX_EXTRA_BADGES) {
                            user.progress[catId].extraBadgeCount += 1;
                            gotExtraBadge = true;
                            setTimeout(() => playTone('crown'), 500);
                        }
                    }
                }
                saveData();
                state.resultInfo = { isPass, score: accuracy, canGetStamp, gotExtraBadge };
                updateScreen('result');
            }
        }

        function startChallengeMode() {
            playTone('tap');
            state.currentCategory = 'challenge_mode';
            state.questionIndex = 0;
            state.sessionPerfectWordCount = 0;
            state.sessionErrorWords = [];
            state.showHint = false;
            loadQuestion('challenge_mode', 0);
            updateScreen('game');
        }

        // --- 7. キーボード入力対応 ---
        window.addEventListener('keydown', (e) => {
            if (state.screen !== 'game') return;
            if (state.isCorrect) { if (e.key === 'Enter') nextQuestion(); return; }
            if (e.key === 'Backspace') {
                for (let i = state.answerSlots.length - 1; i >= 0; i--) {
                    const slot = state.answerSlots[i];
                    if (slot && slot.char !== ' ') { handleAnswerClick(i); return; }
                }
                return;
            }
            if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                const inputChar = e.key;
                const targetLetter = state.poolLetters.find(l => {
                    const isUsed = state.answerSlots.some(slot => slot?.id === l.id);
                    return !isUsed && l.char === inputChar;
                });
                if (targetLetter) handlePoolClick(targetLetter.id);
            }
        });

        // 初期化
        initData();
        render();

    </script>
</body>
</html>
