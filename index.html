    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes spin-in {
            from { transform: rotate(-180deg) scale(0); opacity: 0; }
            to { transform: rotate(0) scale(1); opacity: 1; }
        }
        .animate-spin-in {
            animation: spin-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes shine {
            0%, 80% { transform: scale(1); filter: brightness(100%) drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
            85% { transform: scale(1.2) rotate(-5deg); filter: brightness(130%) drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
            90% { transform: scale(1.2) rotate(5deg); filter: brightness(130%) drop-shadow(0 0 5px rgba(255,215,0,0.6)); }
            100% { transform: scale(1); filter: brightness(100%) drop-shadow(0 1px 1px rgba(0,0,0,0.1)); }
        }
        .animate-shine {
            animation: shine 4s infinite;
            display: inline-block;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
        /* ルビの調整 */
        ruby {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            ruby-align: center;
        }
        rt {
            font-size: 0.6em;
            font-weight: normal;
            color: #64748b; /* slate-500 */
            margin-bottom: -0.2em;
        }
        /* ポップアップ用アニメーション */
        @keyframes modal-in {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-modal-in {
            animation: modal-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

        // --- 3. 音声・効果音エンジン ---

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();

        function initAudio() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(type) {
            if (!state.isSoundOn) return;
            initAudio();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            switch (type) {
                case 'tap':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
                case 'remove':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'hint':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'correct':
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(659.25, now + 0.1); 
                    osc.frequency.setValueAtTime(783.99, now + 0.2); 
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.6);
                    osc.start(now);
                    osc.stop(now + 0.6);
                    break;
                case 'error':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'complete': 
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(659.25, now + 0.15); 
                    osc.frequency.setValueAtTime(783.99, now + 0.30); 
                    osc.frequency.setValueAtTime(1046.50, now + 0.45); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.8);
                    osc.start(now);
                    osc.stop(now + 0.8);
                    break;
                case 'perfect': 
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(523.25, now); 
                    osc.frequency.setValueAtTime(523.25, now + 0.12); 
                    osc.frequency.setValueAtTime(523.25, now + 0.24); 
                    osc.frequency.setValueAtTime(783.99, now + 0.36); 
                    osc.frequency.setValueAtTime(659.25, now + 0.60); 
                    osc.frequency.setValueAtTime(783.99, now + 0.72); 
                    osc.frequency.setValueAtTime(1046.50, now + 0.84); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 2.0);
                    osc.start(now);
                    osc.stop(now + 2.0);
                    break;
                case 'crown': 
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1046.50, now); 
                    osc.frequency.setValueAtTime(1318.51, now + 0.1); 
                    osc.frequency.setValueAtTime(1567.98, now + 0.2); 
                    osc.frequency.setValueAtTime(2093.00, now + 0.4); 
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 1.0);
                    osc.start(now);
                    osc.stop(now + 1.0);
                    break;
                case 'stamp':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
            }
        }

            window.speechSynthesis.speak(utterance);

        function render() {
            app.innerHTML = '';

            const userData = (state.currentUserId && state.allUsersData[state.currentUserId]) 
                ? state.allUsersData[state.currentUserId] 
                : { progress: {}, history: [], challengeWords: [] };
            
            if (!userData.challengeWords) userData.challengeWords = [];

            if (state.screen === 'userSelect') {
                renderUserSelect();
            } else if (state.screen === 'userEdit') {
                renderUserEdit();
            } else if (state.screen === 'home') {
                renderHome(currentUser, userData.progress, userData.challengeWords);
            } else if (state.screen === 'stampBook') {
                renderStampBook(userData.progress);
            } else if (state.screen === 'history') {
                renderHistory(userData.history);
            } else if (state.screen === 'game') {
                renderGame(currentUser);
            } else if (state.screen === 'result') {
                renderResult(currentUser, userData.progress);
            } else if (state.screen === 'stampSelect') {
                renderStampSelect();
            }

            // Lucideアイコンの再描画
            lucide.createIcons();
        }

                            <h2 class="text-4xl font-bold text-slate-800 mb-6 transition-all duration-500">${currentWordData.jp}</h2>

                            <div class="flex gap-4 mb-8">
                                <button onclick="handleSpeak()" class="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-full font-bold text-sm hover:bg-indigo-100 transition-colors">
                                    <i data-lucide="ear" class="w-5 h-5"></i> きく
                                </button>
                            </div>

                            <div class="flex flex-wrap justify-center gap-2 min-h-[100px] items-end pb-2 px-2">`;

            state.answerSlots.forEach((letter, i) => {
                const targetChar = currentWordData.en[i];
                const isWrong = letter && letter.char !== targetChar;
                const isSpace = letter && letter.char === ' '; 

                if (state.isCorrect) {
                    html += `<div class="font-black text-transparent bg-clip-text bg-gradient-to-br from-indigo-500 to-purple-600 animate-in zoom-in duration-500 px-0.5 ${sizeClass.text}" style="text-shadow: 0 4px 12px rgba(99, 102, 241, 0.2)">${isSpace ? '&nbsp;' : letter.char}</div>`;
                } else if (isSpace) {
                    html += `<div class="${sizeClass.box} flex items-end justify-center"></div>`;
                } else {
                    html += `
                    <button onclick="handleAnswerClick(${i})" ${!letter ? 'disabled' : ''} class="${sizeClass.box} ${sizeClass.text} rounded-lg flex items-end justify-center font-bold transition-all border-b-4 relative overflow-visible ${letter ? (isWrong ? 'text-red-500 border-red-300 hover:text-red-600' : 'text-indigo-600 border-indigo-400 hover:text-indigo-700 active:translate-y-1 active:border-b-0') : 'border-slate-200 border-dashed border-2'}">
                        ${!letter && state.showHint ? `<span class="text-slate-200 pointer-events-none">${targetChar}</span>` : ''}
                        ${letter ? letter.char : ''}
                        ${isWrong ? `<span class="absolute -top-3 -right-3 bg-white rounded-full shadow-sm z-20"><i data-lucide="alert-circle" class="w-5 h-5 text-red-500 fill-red-50"></i></span>` : ''}
                    </button>`;
                }
            });

            html += `</div></div></div>
            
            <div class="w-full p-4">
                <p class="text-center text-slate-400 text-sm mb-4 font-bold tracking-widest">TAP or TYPE</p>
                <div class="flex flex-wrap justify-center gap-4 md:gap-6">`;
            
            state.poolLetters.forEach((letter) => {
                const isUsed = state.answerSlots.some(l => l?.id === letter.id);
                html += `
                <div class="relative ${sizeClass.box}">
                    <button onclick="handlePoolClick('${letter.id}')" ${isUsed || state.isCorrect ? 'disabled' : ''} class="absolute inset-0 w-full h-full bg-white rounded-xl flex items-end justify-center ${sizeClass.text} font-bold text-slate-700 shadow-md border-b-[6px] border-slate-200 active:border-b-0 active:translate-y-1 active:bg-slate-50 transition-all ${isUsed ? 'opacity-0 pointer-events-none' : 'opacity-100'}">
                        ${letter.char}
                    </button>
                    ${isUsed ? `<div class="absolute inset-0 w-full h-full rounded-xl border-2 border-slate-100 bg-slate-50/50"></div>` : ''}
                </div>`;
            });

            html += `</div></div></div>`;

            if (state.isCorrect) {
                html += `
                <div class="fixed bottom-8 w-full max-w-md px-4 animate-in slide-in-from-bottom-4 fade-in duration-300 z-50">
                    <button onclick="nextQuestion()" class="w-full py-5 bg-green-500 text-white rounded-2xl font-bold text-2xl shadow-xl border-b-8 border-green-600 active:border-b-0 active:translate-y-2 flex items-center justify-center gap-3 transition-all hover:bg-green-400">
                        <span>NEXT</span> <i data-lucide="arrow-right" class="w-8 h-8"></i>
                    </button>
                    <p class="text-center text-green-700 text-xs font-bold mt-2">Press Enter</p>
                </div>`;
            }

            html += `</div>`;
            app.innerHTML = html;
        }

        function renderResult(user, progress) {
            let catLabel = "";
            let catId = state.currentCategory;
            
            const challengeRemaining = (state.allUsersData[state.currentUserId].challengeWords || []).length;

            if (state.currentCategory === 'challenge_mode') {
                catLabel = "チャレンジBOX";
            } else {
                catLabel = DATA[state.currentCategory].label.split('(')[0];
            }

            const { isPass, score, canGetStamp, gotExtraBadge } = state.resultInfo;

            // アイコン表示ロジックの分岐
            let iconHtml = '';

            if (state.currentCategory === 'challenge_mode') {
                // --- チャレンジモードの場合 ---
                if (challengeRemaining === 0) {
                    // 完食！
                    iconHtml = `<div class="relative"><span class="text-8xl animate-bounce inline-block">🎉</span><span class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 bg-yellow-400 text-white font-black px-4 py-1 rounded-full text-lg shadow-md whitespace-nowrap border-2 border-yellow-200">空っぽ！</span></div>`;
                } else {
                    // まだ残ってる
                    iconHtml = `<div class="relative"><i data-lucide="layers" class="w-24 h-24 text-orange-400 fill-orange-100 animate-bounce"></i><span class="absolute -bottom-2 -right-2 bg-red-500 text-white font-bold px-3 py-1 rounded-full text-sm shadow-md whitespace-nowrap border-2 border-white">あと ${challengeRemaining} もん</span></div>`;
                }
            } else {
                // --- 通常モードの場合 ---
                if (canGetStamp) {
                    iconHtml = `<div class="relative"><span class="text-8xl animate-bounce inline-block">🎁</span><i data-lucide="sparkles" class="absolute -top-4 -right-4 w-12 h-12 text-yellow-300 animate-ping"></i></div>`; 
                } else if (isPass) {
                    iconHtml = `<div class="relative"><i data-lucide="trophy" class="w-24 h-24 text-yellow-400 fill-yellow-100 animate-bounce"></i><span class="absolute -bottom-2 -right-2 bg-red-500 text-white font-bold px-2 py-1 rounded-full text-xs shadow-md border-2 border-white">${score}%</span></div>`;
                } else {
                    iconHtml = `<i data-lucide="thumbs-up" class="w-24 h-24 text-slate-400 fill-slate-100 animate-bounce"></i>`;
                }
            }

            let html = `
            <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4 w-full">
                <div class="max-w-md w-full bg-white rounded-3xl p-8 text-center shadow-xl border-4 border-yellow-200 relative overflow-hidden">
                    <div class="mb-6 flex justify-center relative z-10">
                        ${iconHtml}
                    </div>
                    
                    ${isPass 
                        ? `<h2 class="text-4xl font-black text-yellow-500 mb-2 drop-shadow-sm">Great!!</h2>` 
                        : `<h2 class="text-3xl font-bold text-slate-800 mb-2">Good Job!</h2>`
                    }
                    
                    <p class="text-lg text-slate-600 font-bold mb-6">
                        「${catLabel}」<br/>
                        ${isPass ? `よくできたね！` : `最後まで がんばった！`}
                    </p>

                    ${isPass && !canGetStamp && state.currentCategory !== 'challenge_mode' ? `
                        ${gotExtraBadge ? `
                        <div class="bg-yellow-50 border-2 border-yellow-200 rounded-xl p-4 mb-6 animate-in zoom-in">
                            <div class="flex items-center justify-center gap-2 text-yellow-600 font-bold mb-1">
                                <i data-lucide="star" class="w-6 h-6 fill-yellow-400"></i><span class="text-xl">100点 まんてん！</span><i data-lucide="star" class="w-6 h-6 fill-yellow-400"></i>
                            </div>
                            <p class="text-slate-700 font-bold mt-2">メニューの バッジが ふえたよ！</p>
                        </div>` : `
                        <div class="bg-yellow-50 border-2 border-yellow-200 rounded-xl p-4 mb-6 animate-in zoom-in">
                            <div class="flex items-center justify-center gap-2 text-yellow-600 font-bold mb-1">
                                <i data-lucide="sparkles" class="w-5 h-5"></i><span>正解率 ${score}%！</span><i data-lucide="sparkles" class="w-5 h-5"></i>
                            </div>
                            <p class="text-slate-700 font-bold">ごうかく！</p>
                            ${progress[catId]?.stamp ? '' : `<p class="text-sm text-slate-500 font-bold mt-2">あと ${Math.max(0, 3 - progress[catId].perfectCount)}かいで<br/>スタンプ ゲット！</p>`}
                        </div>`}
                    ` : ''}

                    ${canGetStamp ? `
                    <div class="mb-6 animate-in zoom-in duration-500">
                        <button onclick="updateScreen('stampSelect'); playTone('tap')" class="w-full py-4 bg-yellow-400 text-white rounded-2xl font-black text-xl shadow-lg border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 animate-pulse">
                            スタンプを えらぶ！
                        </button>
                    </div>` : `
                    <div class="flex flex-col gap-3 relative z-10">
                        ${state.currentCategory !== 'challenge_mode' ? 
                        `<button onclick="startCategory('${catId}')" class="w-full py-4 rounded-xl bg-indigo-600 text-white font-bold text-lg hover:bg-indigo-700 transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="refresh-ccw" class="w-5 h-5"></i> もういちど やる
                        </button>` : ''}
                        <button onclick="updateScreen('home'); playTone('tap')" class="w-full py-4 rounded-xl bg-slate-200 text-slate-700 font-bold text-lg hover:bg-slate-300 transition-colors flex items-center justify-center gap-2">
                            <i data-lucide="home" class="w-5 h-5"></i> ホームへ もどる
                        </button>
                    </div>`}
                </div>
            </div>`;
            app.innerHTML = html;
        }

        function renderHistory(history) {
            let html = `
            <div class="min-h-screen bg-slate-50 p-4 w-full">
                <div class="max-w-md mx-auto pt-2 h-full flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="updateScreen('home'); playTone('tap')" class="p-2 bg-white rounded-full shadow-sm text-slate-400 hover:text-slate-600">
                            <i data-lucide="arrow-left" class="w-6 h-6"></i>
                        </button>
                        <h2 class="text-xl font-bold text-slate-700 flex items-center gap-2">
                            <i data-lucide="history" class="w-6 h-6 text-indigo-500"></i> がくしゅう きろく
                        </h2>
                        <div class="w-10"></div>
                    </div>
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 flex-1 overflow-hidden flex flex-col min-h-[400px]">
                        <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                            <div class="flex flex-col">
                                <span class="font-bold text-slate-500">${history.length} かい</span>
                                <span class="text-[10px] text-slate-400 font-bold">※さいしん ${HISTORY_LIMIT}けん まで</span>
                            </div>
                            ${history.length > 0 ? `<button onclick="clearHistory()" class="text-xs flex items-center gap-1 text-red-400 hover:text-red-600 font-bold bg-white px-3 py-1.5 rounded-full border border-red-100"><i data-lucide="trash-2" class="w-3 h-3"></i> ぜんぶけす</button>` : ''}
                        </div>
                        <div class="overflow-y-auto flex-1 p-2 space-y-2">`;

            if (history.length === 0) {
                html += `<div class="h-40 flex items-center justify-center text-slate-400 font-bold">まだ きろくが ないよ</div>`;
            } else {
                history.forEach(record => {
                    let cat = null;
                    if (record.categoryId === 'challenge_mode') {
                        cat = { label: 'チャレンジBOX', color: 'from-red-400 to-red-500', words: [{emoji: '🔥'}] };
                    } else {
                        cat = DATA[record.categoryId];
                    }
                    
                    html += `
                    <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                        <div class="w-12 h-12 rounded-lg bg-gradient-to-br ${cat?.color || 'from-slate-300 to-slate-400'} flex items-center justify-center text-2xl text-white">
                            ${cat?.words[0].emoji || '?'}
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-slate-700">${cat?.label.split('(')[0] || 'Unknown'}</div>
                            <div class="text-xs text-slate-400 font-bold">${record.date}</div>
                        </div>
                        ${record.isPass ? `<div class="bg-yellow-100 text-yellow-600 px-2 py-1 rounded-md text-xs font-bold border border-yellow-200">OK!</div>` : ''}
                    </div>`;
                });
            }

            html += `</div></div></div></div>`;
            app.innerHTML = html;
        }

        // --- 6. アクション & イベントハンドラ ---

        function toggleSound() {
            state.isSoundOn = !state.isSoundOn;
            initAudio(); // ユーザーアクションでAudioContext再開
            render();
        }

        function toggleHelp() {
            playTone('tap');
            state.showHelp = !state.showHelp;
            render();
        }

        function openHelp() {
            playTone('tap');
            const user = state.allUsersData[state.currentUserId];
            if (user) {
                user.hasReadHelp = true;
                saveData();
            }
            state.showHelp = true;
            render();
        }

        function selectUser(userId) {
            playTone('tap');
            initAudio();
            state.currentUserId = userId;
            updateScreen('home');
        }

        function startEditUser() {
            playTone('tap');
            state.editingUser = { name: '', icon: ICON_OPTIONS[0], color: COLOR_OPTIONS[0].class };
            updateScreen('userEdit');
        }

        function updateEditingName(val) { 
            state.editingUser.name = val; 
            const btn = document.getElementById('saveUserBtn');
            if (btn) {
                if (val) {
                    btn.disabled = false;
                    btn.classList.remove('bg-slate-300');
                    btn.classList.add('bg-indigo-500', 'hover:bg-indigo-600', 'shadow-md', 'transform', 'hover:-translate-y-1');
                } else {
                    btn.disabled = true;
                    btn.classList.add('bg-slate-300');
                    btn.classList.remove('bg-indigo-500', 'hover:bg-indigo-600', 'shadow-md', 'transform', 'hover:-translate-y-1');
                }
            }
        }
        function updateEditingIcon(icon) { state.editingUser.icon = icon; render(); }
        function updateEditingColor(color) { state.editingUser.color = color; render(); }

        function saveUserEdit() {
            if (!state.editingUser.name) return;
            playTone('correct');
            
            if (state.editingUser.id) {
                state.users = state.users.map(u => u.id === state.editingUser.id ? state.editingUser : u);
            } else {
                const newUser = { ...state.editingUser, id: Date.now().toString() };
                state.users.push(newUser);
                state.allUsersData[newUser.id] = { history: [], progress: {}, challengeWords: [] };
                saveData();
            }
            saveUsers();
            updateScreen('userSelect');
        }

        function deleteUser(userId) {
            if (!confirm('このユーザーと、きろくを さくじょしますか？')) return;
            playTone('remove');
            state.users = state.users.filter(u => u.id !== userId);
            delete state.allUsersData[userId];
            saveUsers();
            saveData();
            render();
        }

        function startCategory(catId) {
            playTone('tap');
            state.currentCategory = catId;
            state.questionIndex = 0;
            
            state.sessionPerfectWordCount = 0;
            state.sessionErrorWords = [];
            state.showHint = false; // ★単元開始時にリセット
            
            loadQuestion(catId, 0);
            updateScreen('game');
        }

        function startChallengeMode() {
            playTone('tap');
            state.currentCategory = 'challenge_mode';
            state.questionIndex = 0;
            state.sessionPerfectWordCount = 0;
            state.sessionErrorWords = [];
            state.showHint = false; // ★チャレンジ開始時にリセット
            
            loadQuestion('challenge_mode', 0);
            updateScreen('game');
        }

        function loadQuestion(catId, index) {
            let cat;
            if (catId === 'challenge_mode') {
                const words = state.allUsersData[state.currentUserId].challengeWords || [];
                cat = { words: words };
            } else {
                cat = DATA[catId];
            }

            const targetWord = cat.words[index].en;
            
            const letters = targetWord.split('').map((char, i) => ({ char, id: `${char}-${i}-${Math.random()}` }));
            state.poolLetters = letters.filter(l => l.char !== ' ').sort(() => Math.random() - 0.5);
            state.answerSlots = letters.map(l => l.char === ' ' ? l : null);
            
            state.isCorrect = false;
            state.currentWordHadError = false;

            // state.showHint = false; // ★削除：ここを消してヒント状態を維持
            state.currentWordUsedHint = state.showHint; // ★追加：ヒントがONなら「使用済み」とする
            
            setTimeout(() => speak(targetWord), 500);
        }

        function handlePoolClick(letterId) {
            if (state.isCorrect) return;
            const letter = state.poolLetters.find(l => l.id === letterId);
            if (!letter) return;
            
            if (state.answerSlots.some(l => l?.id === letter.id)) return;

            const firstEmptyIndex = state.answerSlots.findIndex(slot => slot === null);
            if (firstEmptyIndex !== -1) {
                let cat;
                if (state.currentCategory === 'challenge_mode') {
                    cat = { words: state.allUsersData[state.currentUserId].challengeWords };
                } else {
                    cat = DATA[state.currentCategory];
                }
                const targetChar = cat.words[state.questionIndex].en[firstEmptyIndex];
                
                if (letter.char !== targetChar) {
                    state.currentWordHadError = true; 
                    playTone('error'); 
                } else {
                    playTone('tap');
                }

                state.answerSlots[firstEmptyIndex] = letter;
                render();
                checkAnswer();
            }
        }

        function handleAnswerClick(index) {
            if (state.isCorrect) return;
            const slot = state.answerSlots[index];
            if (slot && slot.char === ' ') return;
            
            playTone('remove');
            state.answerSlots[index] = null;
            render();
        }

        function toggleHint() {
            if (!state.showHint) {
                playTone('hint');
                state.showHint = true;
                state.currentWordUsedHint = true; 
                render();
            } else {
                state.showHint = false;
                render();
            }
        }

        function handleSpeak() {
            let cat;
            if (state.currentCategory === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords };
            } else {
                cat = DATA[state.currentCategory];
            }
            const word = cat.words[state.questionIndex].en;
            speak(word);
        }

        function checkAnswer() {
            let cat;
            if (state.currentCategory === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords };
            } else {
                cat = DATA[state.currentCategory];
            }
            const targetWord = cat.words[state.questionIndex].en;
            const currentAnswer = state.answerSlots.map(l => l ? l.char : '').join('');

            if (state.answerSlots.every(s => s !== null) && currentAnswer === targetWord) {
                playTone('correct');
                state.isCorrect = true;
                
                if (!state.currentWordUsedHint && !state.currentWordHadError) {
                    state.sessionPerfectWordCount++;
                    if (state.currentCategory === 'challenge_mode') {
                        // nextQuestionで処理
                    }

                } else if (!state.currentWordUsedHint && state.currentWordHadError) {
                    if (state.currentCategory !== 'challenge_mode') {
                        const alreadyIn = state.sessionErrorWords.some(w => w.en === cat.words[state.questionIndex].en);
                        if (!alreadyIn) {
                            state.sessionErrorWords.push(cat.words[state.questionIndex]);
                        }
                    }
                }

                render();
                setTimeout(() => speak("Great! " + targetWord), 300);
            }
        }

        function nextQuestion() {
            playTone('tap');
            let cat;
            if (state.currentCategory === 'challenge_mode') {
                cat = { words: state.allUsersData[state.currentUserId].challengeWords };
            } else {
                cat = DATA[state.currentCategory];
            }

            if (state.currentCategory === 'challenge_mode' && state.isCorrect) {
                if (!state.currentWordUsedHint && !state.currentWordHadError) {
                    const solvedWordEn = cat.words[state.questionIndex].en;
                    const user = state.allUsersData[state.currentUserId];
                    user.challengeWords = user.challengeWords.filter(w => w.en !== solvedWordEn);
                    state.questionIndex--; 
                    saveData();
                }
            }

            let currentWordsLength = 0;
            if (state.currentCategory === 'challenge_mode') {
                currentWordsLength = state.allUsersData[state.currentUserId].challengeWords.length;
            } else {
                currentWordsLength = DATA[state.currentCategory].words.length;
            }

            if (state.questionIndex + 1 < currentWordsLength) {
                state.questionIndex++;
                loadQuestion(state.currentCategory, state.questionIndex);
                render();
            } else {
                // Complete Logic
                let accuracy = 0;
                if (currentWordsLength > 0) {
                     accuracy = Math.round((state.sessionPerfectWordCount / currentWordsLength) * 100);
                } else {
                    accuracy = 100;
                }

                // ★変更：合格ラインと100点満点の判定を分ける
                const isPass = accuracy >= 90;
                const isPerfect = accuracy === 100; 
                
                if (isPerfect) {
                    playTone('perfect');
                } else if (isPass) {
                    playTone('complete');
                } else {
                    playTone('complete');
                }

                const now = new Date();
                const today = now.toLocaleDateString('ja-JP') + ' ' + now.toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'});
                const user = state.allUsersData[state.currentUserId];
                user.history.unshift({ date: today, categoryId: state.currentCategory, isPass });
                if (user.history.length > HISTORY_LIMIT) user.history = user.history.slice(0, HISTORY_LIMIT);

                if (state.currentCategory !== 'challenge_mode') {
                    state.sessionErrorWords.forEach(word => {
                        const exists = user.challengeWords.some(w => w.en === word.en);
                        if (!exists) {
                            user.challengeWords.push(word);
                        }
                    });
                }
                
                let canGetStamp = false;
                let gotExtraBadge = false; // ★追加：バッジが増えたかのフラグ
                const catId = state.currentCategory;

                // ★変更：バッジ追加のロジック
                if (catId !== 'challenge_mode') {
                    if (!user.progress[catId]) {
                        user.progress[catId] = { perfectCount: 0, stamp: null, extraBadgeCount: 0 };
                    }
                    if (user.progress[catId].extraBadgeCount === undefined) {
                        user.progress[catId].extraBadgeCount = 0;
                    }

                    if (!user.progress[catId].stamp) {
                        if (isPass) {
                            user.progress[catId].perfectCount += 1;
                            if (user.progress[catId].perfectCount >= 3) {
                                canGetStamp = true;
                                setTimeout(() => playTone('crown'), 1500); 
                            }
                        }
                    } else {
                        // 既にスタンプがあり、100点満点の場合（合計5個＝追加分の上限を4とする）
                        const MAX_EXTRA_BADGES = 4;
                        if (isPerfect && user.progress[catId].extraBadgeCount < MAX_EXTRA_BADGES) {
                            user.progress[catId].extraBadgeCount += 1;
                            gotExtraBadge = true;
                            setTimeout(() => playTone('crown'), 500); 
                        }
                    }
                }
                saveData();
                // ★変更：gotExtraBadge をリザルトに渡す
                state.resultInfo = { isPass, score: accuracy, canGetStamp, gotExtraBadge };
                updateScreen('result');
            }
        }

        function getStamp(stamp) {
            const user = state.allUsersData[state.currentUserId];
            if (user.progress[state.currentCategory]) {
                user.progress[state.currentCategory].stamp = stamp;
            }
            saveData();
            playTone('stamp');
            updateScreen('stampBook');
        }

        function clearHistory() {
            if (!confirm('ほんとうに きろくを ぜんぶ けしますか？')) return;
            state.allUsersData[state.currentUserId].history = [];
            saveData();
            playTone('remove');
            render();
        }

        // --- 7. キーボード入力対応 (Updated for strict case matching) ---
        window.addEventListener('keydown', (e) => {
            if (state.screen !== 'game') return;
            
            if (state.isCorrect) {
                if (e.key === 'Enter') {
                    nextQuestion();
                }
                return;
            }

            if (e.key === 'Backspace') {
                for (let i = state.answerSlots.length - 1; i >= 0; i--) {
                    const slot = state.answerSlots[i];
                    if (slot && slot.char !== ' ') {
                        handleAnswerClick(i); 
                        return;
                    }
                }
                return;
            }

            // アルファベット入力 (1文字)
            if (e.key.length === 1 && e.key.match(/[a-zA-Z]/)) {
                const inputChar = e.key; 
                
                const targetLetter = state.poolLetters.find(l => {
                    const isUsed = state.answerSlots.some(slot => slot?.id === l.id);
                    // 完全一致で判定 (l.char === inputChar)
                    return !isUsed && l.char === inputChar;
                });

                if (targetLetter) {
                    handlePoolClick(targetLetter.id);
                }
            }
        });

        // 初期化
        initData();
        render();

    </script>
</body>
</html>
